mation when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "An adversary may gather the system time and/or time zone settings from a local or remote system. The system time is set and stored by services, such as the Windows Time Service on Windows or <code>systemsetup</code> on macOS.(Citation: MSDN System Time)(Citation: Technet Windows Time Service)(Citation: systemsetup mac time) These time settings may also be synchronized between systems and services in an enterprise network, typically accomplished with a network time server within a domain.(Citation: Mac Time Sync)(Citation: linux system time)\n\nSystem time information may be gathered in a number of ways, such as with [Net](https://attack.mitre.org/software/S0039) on Windows by performing <code>net time \\\\hostname</code> to gather the system time on a remote system. The victim's time zone may also be inferred from the current system time or gathered by using <code>w32tm /tz</code>.(Citation: Technet Windows Time Service) In addition, adversaries can discover device uptime through functions such as <code>GetTickCount()</code> to determine how long it has been since the system booted up.(Citation: Virtualization/Sandbox Evasion)\n\nOn network devices, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `show clock detail` can be used to see the current time configuration.(Citation: show_clock_detail_cisco_cmd)\n\nIn addition, system calls \u2013 such as <code>time()</code> \u2013 have been used to collect the current time on Linux devices.(Citation: MAGNET GOBLIN) On macOS systems, adversaries may use commands such as <code>systemsetup -gettimezone</code> or <code>timeIntervalSinceNow</code> to gather current time zone information or current date and time.(Citation: System Information Discovery Technique)(Citation: ESET DazzleSpy Jan 2022)\n\nThis information could be useful for performing other techniques, such as executing a file with a [Scheduled Task/Job](https://attack.mitre.org/techniques/T1053)(Citation: RSA EU12 They're Inside), or to discover locality information based on time zone to assist in victim targeting (i.e. [System Location Discovery](https://attack.mitre.org/techniques/T1614)). Adversaries may also use knowledge of system time as part of a time bomb, or delaying execution until a specified date/time.(Citation: AnyRun TimeBomb)", "technique_name": "System Time Discovery", "tactics": "Discovery", "detection": "Command-line interface monitoring may be useful to detect instances of net.exe or other command-line utilities being used to gather system time or time zone. Methods of detecting API use for gathering this information are likely less useful due to how often they may be used by legitimate software.\n\nFor network infrastructure devices, collect AAA logging to monitor `show` commands being run by non-standard users from non-standard locations.", "platforms": "Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_2", "label": "Timestamp Request", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Timestamp Request", "capec_Mitre_Techniques": "1124 - System Time Discovery", "capec_Abstraction": "Detailed", "capec_Status": "Stable", "capec_Description": "This pattern of attack leverages standard requests to learn the exact time associated with a target system. An adversary may be able to use the timestamp returned from the target to attack time-based security algorithms, such as random number generators, or time-based authentication mechanisms.", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The ability to send a timestamp request to a remote target and receive a response.", "capec_Resources_Required": "Scanners or utilities that provide the ability to send custom ICMP queries.", "capec_Consequences": "Scope: Confidentiality | Impact: Other", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_2", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_3", "label": "Network Service Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to get a listing of services running on remote hosts and local network infrastructure devices, including those that may be vulnerable to remote software exploitation. Common methods to acquire this information include port and/or vulnerability scans using tools that are brought onto a system.(Citation: CISA AR21-126A FIVEHANDS May 2021)   \n\nWithin cloud environments, adversaries may attempt to discover services running on other cloud hosts. Additionally, if the cloud environment is connected to a on-premises environment, adversaries may be able to identify services running on non-cloud systems as well.\n\nWithin macOS environments, adversaries may use the native Bonjour application to discover services running on other macOS hosts within a network. The Bonjour mDNSResponder daemon automatically registers and advertises a host\u2019s registered services on the network. For example, adversaries can use a mDNS query (such as <code>dns-sd -B _ssh._tcp .</code>) to find other systems broadcasting the ssh service.(Citation: apple doco bonjour description)(Citation: macOS APT Activity Bradley)", "technique_name": "Network Service Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events from legitimate remote service scanning may be uncommon, depending on the environment and how they are used. Legitimate open port and vulnerability scanning may be conducted within the environment and will need to be deconflicted with any detection capabilities developed. Network intrusion detection systems can also be used to identify scanning activity. Monitor for process use of the networks and inspect intra-network flows to detect port scans.", "platforms": "Containers, IaaS, Linux, Network, Windows, macOS", "data sources": "Cloud Service: Cloud Service Enumeration, Command: Command Execution, Network Traffic: Network Traffic Flow", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_3", "label": "Port Scanning", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Port Scanning", "capec_Mitre_Techniques": "1046 - Network Service Scanning", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary uses a combination of techniques to determine the state of the ports on a remote target. Any service or application available for TCP or UDP networking will have a port open for communications over the network.", "capec_Extended_Description": "Although common services have assigned port numbers, services and applications can run on arbitrary ports. Additionally, port scanning is complicated by the potential for any machine to have up to 65535 possible UDP or TCP services. The goal of port scanning is often broader than identifying open ports, but also give the adversary information concerning the firewall configuration. \n             Depending upon the method of scanning that is used, the process can be stealthy or more obtrusive, the latter being more easily detectable due to the volume of packets involved, anomalous packet traits, or system logging. Typical port scanning activity involves sending probes to a range of ports and observing the responses. There are four port statuses that this type of attack aims to identify: open, closed, filtered, and unfiltered. For strategic purposes it is useful for an adversary to distinguish between an open port that is protected by a filter vs. a closed port that is not protected by a filter. Making these fine grained distinctions is requires certain scan types. Collecting this type of information tells the adversary which ports can be attacked directly, which must be attacked with filter evasion techniques like fragmentation, source port scans, and which ports are unprotected (i.e. not firewalled) but aren't hosting a network service. An adversary often combines various techniques in order to gain a more complete picture of the firewall filtering mechanisms in place for a host.", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary requires logical access to the target's network in order to carry out this type of attack.", "capec_Resources_Required": "The adversary requires a network mapping/scanning tool, or must conduct socket programming on the command line. Packet injection tools are also useful for this purpose. Depending upon the method used it may be necessary to sniff the network in order to see the response.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_3", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_4", "label": "System Network Configuration Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may look for details about the network configuration and settings, such as IP and/or MAC addresses, of systems they access or through information discovery of remote systems. Several operating system administration utilities exist that can be used to gather this information. Examples include [Arp](https://attack.mitre.org/software/S0099), [ipconfig](https://attack.mitre.org/software/S0100)/[ifconfig](https://attack.mitre.org/software/S0101), [nbtstat](https://attack.mitre.org/software/S0102), and [route](https://attack.mitre.org/software/S0103).\n\nAdversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather information about configurations and settings, such as IP addresses of configured interfaces and static/dynamic routes (e.g. <code>show ip route</code>, <code>show ip interface</code>).(Citation: US-CERT-TA18-106A)(Citation: Mandiant APT41 Global Intrusion )\n\nAdversaries may use the information from [System Network Configuration Discovery](https://attack.mitre.org/techniques/T1016) during automated discovery to shape follow-on behaviors, including determining certain access within the target network and what actions to do next.", "technique_name": "System Network Configuration Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, {{LinkById|T1059.008} commands may also be used to gather system and network information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use  commands being run by non-standard users from non-standard locations.  Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).", "platforms": "Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation, Script: Script Execution", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_4", "label": "Network Topology Mapping", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Network Topology Mapping", "capec_Mitre_Techniques": "1016 - System Network Configuration Discovery", "capec_Abstraction": "Standard", "capec_Status": "Draft", "capec_Description": "An adversary engages in scanning activities to map network nodes, hosts, devices, and routes. Adversaries usually perform this type of network reconnaissance during the early stages of attack against an external network. Many types of scanning utilities are typically employed, including ICMP tools, network mappers, port scanners, and route testing utilities such as traceroute.", "capec_Typical_Severity": "Low", "capec_Resources_Required": "Probing requires the ability to interactively send and receive data from a target, whereas passive listening requires a sufficient understanding of the protocol to analyze a preexisting channel of communication.", "capec_Consequences": "Scope: Confidentiality | Impact: Other", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_4", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_5", "label": "System Network Connections Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to get a listing of network connections to or from the compromised system they are currently accessing or from remote systems by querying for information over the network. \n\nAn adversary who gains access to a system that is part of a cloud-based environment may map out Virtual Private Clouds or Virtual Networks in order to determine what systems and services are connected. The actions performed are likely the same types of discovery techniques depending on the operating system, but the resulting information may include details about the networked cloud environment relevant to the adversary's goals. Cloud providers may have different ways in which their virtual networks operate.(Citation: Amazon AWS VPC Guide)(Citation: Microsoft Azure Virtual Network Overview)(Citation: Google VPC Overview) Similarly, adversaries who gain access to network devices may also perform similar discovery activities to gather information about connected systems and services.\n\nUtilities and commands that acquire this information include [netstat](https://attack.mitre.org/software/S0104), \"net use,\" and \"net session\" with [Net](https://attack.mitre.org/software/S0039). In Mac and Linux, [netstat](https://attack.mitre.org/software/S0104) and <code>lsof</code> can be used to list current connections. <code>who -a</code> and <code>w</code> can be used to show which users are currently logged in, similar to \"net session\". Additionally, built-in features native to network devices and [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) may be used (e.g. <code>show ip sockets</code>, <code>show tcp brief</code>).(Citation: US-CERT-TA18-106A)", "technique_name": "System Network Connections Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather system and network information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use commands being run by non-standard users from non-standard locations. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).", "platforms": "IaaS, Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_5", "label": "Network Topology Mapping", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Network Topology Mapping", "capec_Mitre_Techniques": "1049 - System Network Connections Discovery", "capec_Abstraction": "Standard", "capec_Status": "Draft", "capec_Description": "An adversary engages in scanning activities to map network nodes, hosts, devices, and routes. Adversaries usually perform this type of network reconnaissance during the early stages of attack against an external network. Many types of scanning utilities are typically employed, including ICMP tools, network mappers, port scanners, and route testing utilities such as traceroute.", "capec_Typical_Severity": "Low", "capec_Resources_Required": "Probing requires the ability to interactively send and receive data from a target, whereas passive listening requires a sufficient understanding of the protocol to analyze a preexisting channel of communication.", "capec_Consequences": "Scope: Confidentiality | Impact: Other", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_5", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_6", "label": "System Information Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "An adversary may attempt to get detailed information about the operating system and hardware, including version, patches, hotfixes, service packs, and architecture. Adversaries may use the information from [System Information Discovery](https://attack.mitre.org/techniques/T1082) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nTools such as [Systeminfo](https://attack.mitre.org/software/S0096) can be used to gather detailed system information. If running with privileged access, a breakdown of system data can be gathered through the <code>systemsetup</code> configuration tool on macOS. As an example, adversaries with user-level access can execute the <code>df -aH</code> command to obtain currently mounted disks and associated freely available space. Adversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather detailed system information (e.g. <code>show version</code>).(Citation: US-CERT-TA18-106A) [System Information Discovery](https://attack.mitre.org/techniques/T1082) combined with information gathered from other forms of discovery and reconnaissance can drive payload development and concealment.(Citation: OSX.FairyTale)(Citation: 20 macOS Common Tools and Techniques)\n\nInfrastructure as a Service (IaaS) cloud providers such as AWS, GCP, and Azure allow access to instance and virtual machine information via APIs. Successful authenticated API calls can return data such as the operating system platform and status of a particular instance or the model view of a virtual machine.(Citation: Amazon Describe Instance)(Citation: Google Instances Resource)(Citation: Microsoft Virutal Machine API)", "technique_name": "System Information Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather  detailed system information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use  commands being run by non-standard users from non-standard locations. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nIn cloud-based systems, native logging can be used to identify access to certain APIs and dashboards that may contain system information. Depending on how the environment is used, that data alone may not be useful due to benign use during normal operations.", "platforms": "IaaS, Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_6", "label": "Active OS Fingerprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Active OS Fingerprinting", "capec_Mitre_Techniques": "1082 - System Information Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary engages in activity to detect the operating system or firmware version of a remote target by interrogating a device, server, or platform with a probe designed to solicit behavior that will reveal information about the operating systems or firmware in the environment. Operating System detection is possible because implementations of common protocols (Such as IP or TCP) differ in distinct ways. While the implementation differences are not sufficient to 'break' compatibility with the protocol the differences are detectable because the target will respond in unique ways to specific probing activity that breaks the semantic or logical rules of packet construction for a protocol. Different operating systems will have a unique response to the anomalous input, providing the basis to fingerprint the OS behavior. This type of OS fingerprinting can distinguish between operating system types and versions.", "capec_Likelihood_Of_Attack": "Medium", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The ability to monitor and interact with network communications.Access to at least one host, and the privileges to interface with the network interface card.", "capec_Consequences": "Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Hide Activities", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_6", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_7", "label": "System Information Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "An adversary may attempt to get detailed information about the operating system and hardware, including version, patches, hotfixes, service packs, and architecture. Adversaries may use the information from [System Information Discovery](https://attack.mitre.org/techniques/T1082) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nTools such as [Systeminfo](https://attack.mitre.org/software/S0096) can be used to gather detailed system information. If running with privileged access, a breakdown of system data can be gathered through the <code>systemsetup</code> configuration tool on macOS. As an example, adversaries with user-level access can execute the <code>df -aH</code> command to obtain currently mounted disks and associated freely available space. Adversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather detailed system information (e.g. <code>show version</code>).(Citation: US-CERT-TA18-106A) [System Information Discovery](https://attack.mitre.org/techniques/T1082) combined with information gathered from other forms of discovery and reconnaissance can drive payload development and concealment.(Citation: OSX.FairyTale)(Citation: 20 macOS Common Tools and Techniques)\n\nInfrastructure as a Service (IaaS) cloud providers such as AWS, GCP, and Azure allow access to instance and virtual machine information via APIs. Successful authenticated API calls can return data such as the operating system platform and status of a particular instance or the model view of a virtual machine.(Citation: Amazon Describe Instance)(Citation: Google Instances Resource)(Citation: Microsoft Virutal Machine API)", "technique_name": "System Information Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather  detailed system information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use  commands being run by non-standard users from non-standard locations. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nIn cloud-based systems, native logging can be used to identify access to certain APIs and dashboards that may contain system information. Depending on how the environment is used, that data alone may not be useful due to benign use during normal operations.", "platforms": "IaaS, Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_7", "label": "Passive OS Fingerprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Passive OS Fingerprinting", "capec_Mitre_Techniques": "1082 - System Information Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary engages in activity to detect the version or type of OS software in a an environment by passively monitoring communication between devices, nodes, or applications. Passive techniques for operating system detection send no actual probes to a target, but monitor network or client-server communication between nodes in order to identify operating systems based on observed behavior as compared to a database of known signatures or values. While passive OS fingerprinting is not usually as reliable as active methods, it is generally better able to evade detection.", "capec_Likelihood_Of_Attack": "High", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The ability to monitor network communications.Access to at least one host, and the privileges to interface with the network interface card.", "capec_Resources_Required": "Any tool capable of monitoring network communications, like a packet sniffer (e.g., Wireshark)", "capec_Consequences": "Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Hide Activities", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_7", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_8", "label": "File and Directory Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may enumerate files and directories or may search in specific locations of a host or network share for certain information within a file system. Adversaries may use the information from [File and Directory Discovery](https://attack.mitre.org/techniques/T1083) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nMany command shell utilities can be used to obtain this information. Examples include <code>dir</code>, <code>tree</code>, <code>ls</code>, <code>find</code>, and <code>locate</code>.(Citation: Windows Commands JPCERT) Custom tools may also be used to gather file and directory information and interact with the [Native API](https://attack.mitre.org/techniques/T1106). Adversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather file and directory information (e.g. <code>dir</code>, <code>show flash</code>, and/or <code>nvram</code>).(Citation: US-CERT-TA18-106A)\n\nSome files and directories may require elevated or specific user permissions to access.", "technique_name": "File and Directory Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Collection and Exfiltration, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001). Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather file and directory information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use of commands being run by non-standard users from non-standard locations.", "platforms": "Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_8", "label": "File Discovery", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "File Discovery", "capec_Mitre_Techniques": "1083 - File and Directory Discovery", "capec_Abstraction": "Standard", "capec_Status": "Draft", "capec_Description": "An adversary engages in probing and exploration activities to determine if common key files exists. Such files often contain configuration and security parameters of the targeted application, system or network. Using this knowledge may often pave the way for more damaging attacks.", "capec_Likelihood_Of_Attack": "High", "capec_Typical_Severity": "Very Low", "capec_Prerequisites": "The adversary must know the location of these common key files.", "capec_Consequences": "Scope: Confidentiality | Impact: Read Data", "capec_Mitigations": "Leverage file protection mechanisms to render these files accessible only to authorized parties.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_8", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_9", "label": "Process Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to get information about running processes on a system. Information obtained could be used to gain an understanding of common software/applications running on systems within the network. Administrator or otherwise elevated access may provide better process details. Adversaries may use the information from [Process Discovery](https://attack.mitre.org/techniques/T1057) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nIn Windows environments, adversaries could obtain details on running processes using the [Tasklist](https://attack.mitre.org/software/S0057) utility via [cmd](https://attack.mitre.org/software/S0106) or <code>Get-Process</code> via [PowerShell](https://attack.mitre.org/techniques/T1059/001). Information about processes can also be extracted from the output of [Native API](https://attack.mitre.org/techniques/T1106) calls such as <code>CreateToolhelp32Snapshot</code>. In Mac and Linux, this is accomplished with the <code>ps</code> command. Adversaries may also opt to enumerate processes via `/proc`. \n\nOn network devices, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `show processes` can be used to display current running processes.(Citation: US-CERT-TA18-106A)(Citation: show_processes_cisco_cmd)", "technique_name": "Process Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events that look like process discovery may be uncommon, depending on the environment and how they are used. Monitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nFor network infrastructure devices, collect AAA logging to monitor for `show` commands being run by non-standard users from non-standard locations.", "platforms": "Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_9", "label": "Process Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Process Footprinting", "capec_Mitre_Techniques": "1057 - Process Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary exploits functionality meant to identify information about the currently running processes on the target system to an authorized user. By knowing what processes are running on the target system, the adversary can learn about the target environment as a means towards further malicious behavior.", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Mitigations": "Identify programs that may be used to acquire process information and block them by using a software restriction policy or tools that restrict program execution by using a process allowlist.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_9", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_10", "label": "System Service Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may try to gather information about registered local system services. Adversaries may obtain information about services using tools as well as OS utility commands such as <code>sc query</code>, <code>tasklist /svc</code>, <code>systemctl --type=service</code>, and <code>net start</code>.\n\nAdversaries may use the information from [System Service Discovery](https://attack.mitre.org/techniques/T1007) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.", "technique_name": "System Service Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system information related to services. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).", "platforms": "Linux, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_10", "label": "Services Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Services Footprinting", "capec_Mitre_Techniques": "1007 - System Service Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary exploits functionality meant to identify information about the services on the target system to an authorized user. By knowing what services are registered on the target system, the adversary can learn about the target environment as a means towards further malicious behavior. Depending on the operating system, commands that can obtain services information include \"sc\" and \"tasklist/svc\" using Tasklist, and \"net start\" using Net.", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Mitigations": "Identify programs that may be used to acquire service information and block them by using a software restriction policy or tools that restrict program execution by uaing a process allowlist.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_10", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_11", "label": "Account Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to get a listing of valid accounts, usernames, or email addresses on a system or within a compromised environment. This information can help adversaries determine which accounts exist, which can aid in follow-on behavior such as brute-forcing, spear-phishing attacks, or account takeovers (e.g., [Valid Accounts](https://attack.mitre.org/techniques/T1078)).\n\nAdversaries may use several methods to enumerate accounts, including abuse of existing tools, built-in commands, and potential misconfigurations that leak account names and roles or permissions in the targeted environment.\n\nFor examples, cloud environments typically provide easily accessible interfaces to obtain user lists.(Citation: AWS List Users)(Citation: Google Cloud - IAM Servie Accounts List API) On hosts, adversaries can use default [PowerShell](https://attack.mitre.org/techniques/T1059/001) and other command line functionality to identify accounts. Information about email addresses and accounts may also be extracted by searching an infected system\u2019s files.", "technique_name": "Account Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nMonitor for processes that can be used to enumerate user accounts, such as <code>net.exe</code> and <code>net1.exe</code>, especially when executed in quick succession.(Citation: Elastic - Koadiac Detection with EQL)", "platforms": "IaaS, Identity Provider, Linux, Office Suite, SaaS, Windows, macOS", "data sources": "Command: Command Execution, File: File Access, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_11", "label": "Account Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Account Footprinting", "capec_Mitre_Techniques": "1087 - Account Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary exploits functionality meant to identify information about the domain accounts and their permissions on the target system to an authorized user. By knowing what accounts are registered on the target system, the adversary can inform further and more targeted malicious behavior. Example Windows commands which can acquire this information are: \"net user\" and \"dsquery\".", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Mitigations": "Identify programs that may be used to acquire account information and block them by using a software restriction policy or tools that restrict program execution by uysing a process allowlist.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_11", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_12", "label": "Permission Groups Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to discover group and permission settings. This information can help adversaries determine which user accounts and groups are available, the membership of users in particular groups, and which users and groups have elevated permissions.\n\nAdversaries may attempt to discover group permission settings in many different ways. This data may provide the adversary with information about the compromised environment that can be used in follow-on activity and targeting.(Citation: CrowdStrike BloodHound April 2018)", "technique_name": "Permission Groups Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001). Monitor container logs for commands and/or API calls related to listing permissions for pods and nodes, such as <code>kubectl auth can-i</code>.(Citation: K8s Authorization Overview)", "platforms": "Containers, IaaS, Identity Provider, Linux, Office Suite, SaaS, Windows, macOS", "data sources": "Application Log: Application Log Content, Command: Command Execution, Group: Group Enumeration, Group: Group Metadata, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_12", "label": "Group Permission Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Group Permission Footprinting", "capec_Mitre_Techniques": "1069 - Permission Groups Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary exploits functionality meant to identify information about user groups and their permissions on the target system to an authorized user. By knowing what users/permissions are registered on the target system, the adversary can inform further and more targeted malicious behavior. An example Windows command which can list local groups is \"net localgroup\".", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Mitigations": "Identify programs (such as \"net\") that may be used to enumerate local group permissions and block them by using a software restriction Policy or tools that restrict program execution by using a process allowlist.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_12", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_13", "label": "Group Policy Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may gather information on Group Policy settings to identify paths for privilege escalation, security measures applied within a domain, and to discover patterns in domain objects that can be manipulated or used to blend in the environment. Group Policy allows for centralized management of user and computer settings in Active Directory (AD). Group policy objects (GPOs) are containers for group policy settings made up of files stored within a predictable network path `\\<DOMAIN>\\SYSVOL\\<DOMAIN>\\Policies\\`.(Citation: TechNet Group Policy Basics)(Citation: ADSecurity GPO Persistence 2016)\n\nAdversaries may use commands such as <code>gpresult</code> or various publicly available PowerShell functions, such as <code>Get-DomainGPO</code> and <code>Get-DomainGPOLocalGroup</code>, to gather information on Group Policy settings.(Citation: Microsoft gpresult)(Citation: Github PowerShell Empire) Adversaries may use this information to shape follow-on behaviors, including determining potential attack paths within the target network as well as opportunities to manipulate Group Policy settings (i.e. [Domain or Tenant Policy Modification](https://attack.mitre.org/techniques/T1484)) for their benefit.", "technique_name": "Group Policy Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor for suspicious use of <code>gpresult</code>. Monitor for the use of PowerShell functions such as <code>Get-DomainGPO</code> and <code>Get-DomainGPOLocalGroup</code> and processes spawning with command-line arguments containing <code>GPOLocalGroup</code>.\n\nMonitor for abnormal LDAP queries with filters for <code>groupPolicyContainer</code> and high volumes of LDAP traffic to domain controllers. Windows Event ID 4661 can also be used to detect when a directory service has been accessed.", "platforms": "Windows", "data sources": "Active Directory: Active Directory Object Access, Command: Command Execution, Network Traffic: Network Traffic Content, Process: Process Creation, Script: Script Execution", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_13", "label": "Group Permission Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Group Permission Footprinting", "capec_Mitre_Techniques": "1615 - Group Policy Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary exploits functionality meant to identify information about user groups and their permissions on the target system to an authorized user. By knowing what users/permissions are registered on the target system, the adversary can inform further and more targeted malicious behavior. An example Windows command which can list local groups is \"net localgroup\".", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Mitigations": "Identify programs (such as \"net\") that may be used to enumerate local group permissions and block them by using a software restriction Policy or tools that restrict program execution by using a process allowlist.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_13", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_14", "label": "System Owner/User Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to identify the primary user, currently logged in user, set of users that commonly uses a system, or whether a user is actively using the system. They may do this, for example, by retrieving account usernames or by using [OS Credential Dumping](https://attack.mitre.org/techniques/T1003). The information may be collected in a number of different ways using other Discovery techniques, because user and username details are prevalent throughout a system and include running process ownership, file/directory ownership, session information, and system logs. Adversaries may use the information from [System Owner/User Discovery](https://attack.mitre.org/techniques/T1033) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nVarious utilities and commands may acquire this information, including <code>whoami</code>. In macOS and Linux, the currently logged in user can be identified with <code>w</code> and <code>who</code>. On macOS the <code>dscl . list /Users | grep -v '_'</code> command can also be used to enumerate user accounts. Environment variables, such as <code>%USERNAME%</code> and <code>$USER</code>, may also be used to access this information.\n\nOn network devices, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `show users` and `show ssh` can be used to display users currently logged into the device.(Citation: show_ssh_users_cmd_cisco)(Citation: US-CERT TA18-106A Network Infrastructure Devices 2018)", "technique_name": "System Owner/User Discovery", "tactics": "Discovery", "detection": "`System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nFor network infrastructure devices, collect AAA logging to monitor `show` commands being run by non-standard users from non-standard locations.", "platforms": "Linux, Network, Windows, macOS", "data sources": "Active Directory: Active Directory Object Access, Command: Command Execution, File: File Access, Network Traffic: Network Traffic Content, Network Traffic: Network Traffic Flow, Process: OS API Execution, Process: Process Access, Process: Process Creation, Windows Registry: Windows Registry Key Access", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_14", "label": "Owner Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Owner Footprinting", "capec_Mitre_Techniques": "1033 - System Owner/User Discovery", "capec_Abstraction": "Standard", "capec_Status": "Draft", "capec_Description": "An adversary exploits functionality meant to identify information about the primary users on the target system to an authorized user. They may do this, for example, by reviewing logins or file modification times. By knowing what owners use the target system, the adversary can inform further and more targeted malicious behavior. An example Windows command that may accomplish this is \"dir /A ntuser.dat\". Which will display the last modified time of a user's ntuser.dat file when run within the root folder of a user. This time is synonymous with the last time that user was logged in.", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary must have gained access to the target system via physical or logical means in order to carry out this attack. || Administrator permissions are required to view the home folder of other users.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Mitigations": "Ensure that proper permissions on files and folders are enacted to limit accessibility.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_14", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_15", "label": "Network Share Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may look for folders and drives shared on remote systems as a means of identifying sources of information to gather as a precursor for Collection and to identify potential systems of interest for Lateral Movement. Networks often contain shared network drives and folders that enable users to access file directories on various systems across a network. \n\nFile sharing over a Windows network occurs over the SMB protocol. (Citation: Wikipedia Shared Resource) (Citation: TechNet Shared Folder) [Net](https://attack.mitre.org/software/S0039) can be used to query a remote system for available shared drives using the <code>net view \\\\\\\\remotesystem</code> command. It can also be used to query shared drives on the local system using <code>net share</code>. For macOS, the <code>sharing -l</code> command lists all shared points used for smb services.", "technique_name": "Network Share Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events related to legitimate remote system discovery may be uncommon, depending on the environment and how they are used. Monitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).", "platforms": "Linux, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteract
