<!doctype html>

<head>

  <title>Attack Tree  Discovery</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; background: #f4f4f4;
                  font-family: Arial, Helvetica, sans-serif; font-size: 15px; }
    .app { display: flex; height: 100vh; gap: 0; overflow: hidden; }
    .graph-col { flex: 1 1 auto; display: flex; flex-direction: column;
                  overflow: hidden; background: #fff; border-right: 2px solid #d0d0d0; }
    .graph-header { padding: 10px 16px 8px; border-bottom: 1px solid #e0e0e0; background: #fff; }
    .graph-header h1 { margin: 0 0 6px; font-size: 20px; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .legend-item { padding: 3px 10px; border-radius: 4px; font-size: 13px;
                     border: 1px solid rgba(0,0,0,.12); }
    .svg-scroll { flex: 1 1 auto; overflow: auto; padding: 12px; background: #fafafa; }
    .svg-scroll svg { width: auto; height: auto; display: block; cursor: default; }
    .svg-scroll [data-node-id] { cursor: pointer; }
    .svg-scroll [data-node-id]:hover ellipse,
    .svg-scroll [data-node-id]:hover polygon,
    .svg-scroll [data-node-id]:hover path { filter: brightness(0.88); }
    .selected-node ellipse, .selected-node polygon, .selected-node path {
      stroke: #1a6fc4 !important; stroke-width: 3px !important; }
    .graph-footer { padding: 6px 16px; font-size: 13px; color: #666;
                      border-top: 1px solid #e0e0e0; background: #fff; }
    .panel-col { flex: 0 0 400px; display: flex; flex-direction: column;
                   background: #fff; overflow: hidden; transition: flex-basis .2s; }
    .panel-col.hidden { flex: 0 0 0; overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between;
                      padding: 10px 14px; border-bottom: 1px solid #e0e0e0; background: #f8f8f8; }
    .panel-header h2 { margin: 0; font-size: 16px; }
    .close-btn { border: none; background: transparent; font-size: 22px; cursor: pointer;
                   line-height: 1; padding: 0 4px; color: #555; }
    .close-btn:hover { color: #000; }
    .panel-body { flex: 1 1 auto; overflow-y: auto; padding: 14px; }
    .panel-placeholder { color: #888; font-style: italic; margin-top: 20px; text-align: center; }
    .node-label-heading { font-size: 17px; font-weight: 700; margin: 0 0 4px; word-break: break-word; }
    .node-type-badge { display: inline-block; padding: 2px 8px; border-radius: 20px;
                         font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .meta-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    .meta-table th { text-align: left; padding: 6px 8px; background: #f3f3f3;
                       border-bottom: 1px solid #e0e0e0; font-weight: 600; width: 36%;
                       vertical-align: top; word-break: break-word; }
    .meta-table td { padding: 6px 8px; border-bottom: 1px solid #eee;
                       vertical-align: top; word-break: break-word; }
    .meta-empty { color: #888; font-style: italic; }
    .badge-root    { background: #FFD700; color: #5a4200; }
    .badge-tactic  { background: #98FB98; color: #1a5c1a; }
    .badge-cwe     { background: #ADD8E6; color: #1a3a5c; }
    .badge-tech    { background: #90EE90; color: #1a5c1a; }
    .badge-subtech { background: #FFFACD; color: #5c5000; }
    .badge-capec   { background: #FFB6C1; color: #6b0a1e; }
    .badge-gate    { background: #FFCCCB; color: #7a1a00; }
  </style>
</head>

<script>
var NODE_HTML  = {"t5_tactic": "<table class='meta-table'><tr><th>tactic</th><td>Discovery</td></tr></table>", "t5_cwe_0": "<table class='meta-table'><tr><th>cwe_Name</th><td>Exposure of Sensitive Information to an Unauthorized Actor</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>cwe_Abstraction</th><td>Class</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Draft</td></tr><tr><th>cwe_Description</th><td>The product exposes sensitive information to an actor that is not explicitly authorized to have access to that information.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-668 (ChildOf, View: 1000, Ordinal: Primary)</td></tr><tr><th>cwe_Weakness_Ordinality</th><td>Primary, Resultant</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Architecture and Design: N/A | Implementation: N/A</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Confidentiality | Impact: Read Application Data | Note: N/A</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Automated Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: High | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: High | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: High | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Architecture and Design | Description: Compartmentalize the system to have &quot;safe&quot; areas where trust boundaries can be unambiguously drawn. Do not allow sensitive data to go outside of the trust boundary and always be careful when interfacing with a compartment outside of the safe area. Ensure that appropriate compartmentalization is built into the system design, and the compartmentalization allows for and reinforces privilege separation functionality. Architects and designers should rely on the principle of least privilege to decide the appropriate time to use privileges and the time to drop privileges.</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>NONE</td></tr><tr><th>exploitabilityScore</th><td>3.9</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_0": "<table class='meta-table'><tr><th>technique_name</th><td>Browser Information Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may enumerate information about browsers to learn more about compromised environments. Data saved by browsers (such as bookmarks, accounts, and browsing history) may reveal a variety of personal information about users (e.g., banking sites, relationships/interests, social media, etc.) as well as details about internal network resources such as servers, tools/dashboards, or other related infrastructure.(Citation: Kaspersky Autofill)\n\nBrowser information may also highlight additional targets after an adversary has access to valid credentials, especially [Credentials In Files](https://attack.mitre.org/techniques/T1552/001) associated with logins cached by a browser.\n\nSpecific storage locations vary based on platform and/or application, but browser information is typically stored in local files and databases (e.g., `%APPDATA%/Google/Chrome`).(Citation: Chrome Roaming Profiles)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>Monitor processes and command-line arguments for actions that could be taken to gather browser bookmark information. Remote access tools with built-in features may interact directly using APIs to gather information. Information may also be acquired through system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nSystem and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Collection and Exfiltration, based on the information obtained.</td></tr><tr><th>platforms</th><td>Linux, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, File: File Access, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_0": "<table class='meta-table'><tr><th>capec_Name</th><td>Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1217 - Browser Bookmark Discovery</td></tr><tr><th>capec_Abstraction</th><td>Meta</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary engages in probing and exploration activities to identify constituents and properties of the target.</td></tr><tr><th>capec_Extended_Description</th><td>Footprinting is a general term to describe a variety of information gathering techniques, often used by attackers in preparation for some attack. It consists of using tools to learn as much as possible about the composition, configuration, and security mechanisms of the targeted application, system or network. Information that might be collected during a footprinting effort could include open ports, applications and their versions, network topology, and similar information. Although similar to fingerprinting, footprinting aims to get a more holistic view of a system or network, whereas fingerprinting is more targeted to a specific application or operating system. While footprinting is not intended to be damaging (although certain activities, such as network scans, can sometimes cause disruptions to vulnerable applications inadvertently) it may often pave the way for more damaging attacks.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Very Low</td></tr><tr><th>capec_Execution_Flow</th><td>Step 1: Explore - [Request Footprinting] The attacker examines the website information and source code of the website and uses automated tools to get as much information as possible about the system and organization. (Techniques: Open Source Footprinting: Examine the website about the organization and skim through the webpage&#x27;s HTML source to look for comments., Network Enumeration: Perform various queries (Registrar Query, Organizational Query, Domain Query, Network Query, POC Query) on the many whois databases found on the internet to identify domain names and associated networks., DNS Interrogation: Once basic information is gathered the attack could begin to query DNS., Other Techniques: Use ping sweep, TCP scan, UDP scan, OS Identification various techniques to gain more information about the system and network.)</td></tr><tr><th>capec_Prerequisites</th><td>An application must publicize identifiable information about the system or application through voluntary or involuntary means. Certain identification details of information systems are visible on communication networks (e.g., if an adversary uses a sniffer to inspect the traffic) due to their inherent structure and protocol standards. Any system or network that can be detected can be footprinted. However, some configuration choices may limit the useful information that can be collected during a footprinting attack.</td></tr><tr><th>capec_Skills_Required</th><td>Low: The adversary knows how to send HTTP request, run the scan tool.</td></tr><tr><th>capec_Resources_Required</th><td>The adversary requires a variety of tools to collect information about the target. These include port/network scanners and tools to analyze responses from applications to determine version and configuration information. Footprinting a system adequately may also take a few days if the attacker wishes the footprinting attempt to go undetected.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data</td></tr><tr><th>capec_Mitigations</th><td>Keep patches up to date by installing weekly or daily if possible. || Shut down unnecessary services/ports. || Change default passwords by choosing strong passwords. || Curtail unexpected input. || Encrypt and password-protect sensitive data. || Avoid including information that has the potential to identify and compromise your organization&#x27;s security such as access to business plans, formulas, and proprietary documents.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_1": "<table class='meta-table'><tr><th>technique_name</th><td>Remote System Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to get a listing of other systems by IP address, hostname, or other logical identifier on a network that may be used for Lateral Movement from the current system. Functionality could exist within remote access tools to enable this, but utilities available on the operating system could also be used such as  [Ping](https://attack.mitre.org/software/S0097) or &lt;code&gt;net view&lt;/code&gt; using [Net](https://attack.mitre.org/software/S0039).\n\nAdversaries may also analyze data from local host files (ex: &lt;code&gt;C:\\Windows\\System32\\Drivers\\etc\\hosts&lt;/code&gt; or &lt;code&gt;/etc/hosts&lt;/code&gt;) or other passive means (such as local [Arp](https://attack.mitre.org/software/S0099) cache entries) in order to discover the presence of remote systems in an environment.\n\nAdversaries may also target discovery of network infrastructure as well as leverage [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands on network devices to gather detailed information about systems within a network (e.g. &lt;code&gt;show cdp neighbors&lt;/code&gt;, &lt;code&gt;show arp&lt;/code&gt;).(Citation: US-CERT-TA18-106A)(Citation: CISA AR21-126A FIVEHANDS May 2021)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events related to legitimate remote system discovery may be uncommon, depending on the environment and how they are used. Monitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nMonitor for processes that can be used to discover remote systems, such as &lt;code&gt;ping.exe&lt;/code&gt; and &lt;code&gt;tracert.exe&lt;/code&gt;, especially when executed in quick succession.(Citation: Elastic - Koadiac Detection with EQL)</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, File: File Access, Network Traffic: Network Connection Creation, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_1": "<table class='meta-table'><tr><th>capec_Name</th><td>Host Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1018 - Remote System Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary sends a probe to an IP address to determine if the host is alive. Host discovery is one of the earliest phases of network reconnaissance. The adversary usually starts with a range of IP addresses belonging to a target network and uses various methods to determine if a host is present at that IP address. Host discovery is usually referred to as &#x27;Ping&#x27; scanning using a sonar analogy. The goal is to send a packet through to the IP address and solicit a response from the host. As such, a &#x27;ping&#x27; can be virtually any crafted packet whatsoever, provided the adversary can identify a functional host based on its response. An attack of this nature is usually carried out with a &#x27;ping sweep,&#x27; where a particular kind of ping is sent to a range of IP addresses.</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary requires logical access to the target network in order to carry out host discovery.</td></tr><tr><th>capec_Resources_Required</th><td>The resources required will differ based upon the type of host discovery being performed. Usually a network scanning tool or scanning script is required due to the volume of requests that must be generated.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_2": "<table class='meta-table'><tr><th>technique_name</th><td>System Time Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>An adversary may gather the system time and/or time zone settings from a local or remote system. The system time is set and stored by services, such as the Windows Time Service on Windows or &lt;code&gt;systemsetup&lt;/code&gt; on macOS.(Citation: MSDN System Time)(Citation: Technet Windows Time Service)(Citation: systemsetup mac time) These time settings may also be synchronized between systems and services in an enterprise network, typically accomplished with a network time server within a domain.(Citation: Mac Time Sync)(Citation: linux system time)\n\nSystem time information may be gathered in a number of ways, such as with [Net](https://attack.mitre.org/software/S0039) on Windows by performing &lt;code&gt;net time \\\\hostname&lt;/code&gt; to gather the system time on a remote system. The victim&#x27;s time zone may also be inferred from the current system time or gathered by using &lt;code&gt;w32tm /tz&lt;/code&gt;.(Citation: Technet Windows Time Service) In addition, adversaries can discover device uptime through functions such as &lt;code&gt;GetTickCount()&lt;/code&gt; to determine how long it has been since the system booted up.(Citation: Virtualization/Sandbox Evasion)\n\nOn network devices, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `show clock detail` can be used to see the current time configuration.(Citation: show_clock_detail_cisco_cmd)\n\nIn addition, system calls \u2013 such as &lt;code&gt;time()&lt;/code&gt; \u2013 have been used to collect the current time on Linux devices.(Citation: MAGNET GOBLIN) On macOS systems, adversaries may use commands such as &lt;code&gt;systemsetup -gettimezone&lt;/code&gt; or &lt;code&gt;timeIntervalSinceNow&lt;/code&gt; to gather current time zone information or current date and time.(Citation: System Information Discovery Technique)(Citation: ESET DazzleSpy Jan 2022)\n\nThis information could be useful for performing other techniques, such as executing a file with a [Scheduled Task/Job](https://attack.mitre.org/techniques/T1053)(Citation: RSA EU12 They&#x27;re Inside), or to discover locality information based on time zone to assist in victim targeting (i.e. [System Location Discovery](https://attack.mitre.org/techniques/T1614)). Adversaries may also use knowledge of system time as part of a time bomb, or delaying execution until a specified date/time.(Citation: AnyRun TimeBomb)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>Command-line interface monitoring may be useful to detect instances of net.exe or other command-line utilities being used to gather system time or time zone. Methods of detecting API use for gathering this information are likely less useful due to how often they may be used by legitimate software.\n\nFor network infrastructure devices, collect AAA logging to monitor `show` commands being run by non-standard users from non-standard locations.</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_2": "<table class='meta-table'><tr><th>capec_Name</th><td>Timestamp Request</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1124 - System Time Discovery</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>This pattern of attack leverages standard requests to learn the exact time associated with a target system. An adversary may be able to use the timestamp returned from the target to attack time-based security algorithms, such as random number generators, or time-based authentication mechanisms.</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The ability to send a timestamp request to a remote target and receive a response.</td></tr><tr><th>capec_Resources_Required</th><td>Scanners or utilities that provide the ability to send custom ICMP queries.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_3": "<table class='meta-table'><tr><th>technique_name</th><td>Network Service Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to get a listing of services running on remote hosts and local network infrastructure devices, including those that may be vulnerable to remote software exploitation. Common methods to acquire this information include port and/or vulnerability scans using tools that are brought onto a system.(Citation: CISA AR21-126A FIVEHANDS May 2021)   \n\nWithin cloud environments, adversaries may attempt to discover services running on other cloud hosts. Additionally, if the cloud environment is connected to a on-premises environment, adversaries may be able to identify services running on non-cloud systems as well.\n\nWithin macOS environments, adversaries may use the native Bonjour application to discover services running on other macOS hosts within a network. The Bonjour mDNSResponder daemon automatically registers and advertises a host\u2019s registered services on the network. For example, adversaries can use a mDNS query (such as &lt;code&gt;dns-sd -B _ssh._tcp .&lt;/code&gt;) to find other systems broadcasting the ssh service.(Citation: apple doco bonjour description)(Citation: macOS APT Activity Bradley)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events from legitimate remote service scanning may be uncommon, depending on the environment and how they are used. Legitimate open port and vulnerability scanning may be conducted within the environment and will need to be deconflicted with any detection capabilities developed. Network intrusion detection systems can also be used to identify scanning activity. Monitor for process use of the networks and inspect intra-network flows to detect port scans.</td></tr><tr><th>platforms</th><td>Containers, IaaS, Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Cloud Service: Cloud Service Enumeration, Command: Command Execution, Network Traffic: Network Traffic Flow</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_3": "<table class='meta-table'><tr><th>capec_Name</th><td>Port Scanning</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1046 - Network Service Scanning</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary uses a combination of techniques to determine the state of the ports on a remote target. Any service or application available for TCP or UDP networking will have a port open for communications over the network.</td></tr><tr><th>capec_Extended_Description</th><td>Although common services have assigned port numbers, services and applications can run on arbitrary ports. Additionally, port scanning is complicated by the potential for any machine to have up to 65535 possible UDP or TCP services. The goal of port scanning is often broader than identifying open ports, but also give the adversary information concerning the firewall configuration. \n             Depending upon the method of scanning that is used, the process can be stealthy or more obtrusive, the latter being more easily detectable due to the volume of packets involved, anomalous packet traits, or system logging. Typical port scanning activity involves sending probes to a range of ports and observing the responses. There are four port statuses that this type of attack aims to identify: open, closed, filtered, and unfiltered. For strategic purposes it is useful for an adversary to distinguish between an open port that is protected by a filter vs. a closed port that is not protected by a filter. Making these fine grained distinctions is requires certain scan types. Collecting this type of information tells the adversary which ports can be attacked directly, which must be attacked with filter evasion techniques like fragmentation, source port scans, and which ports are unprotected (i.e. not firewalled) but aren&#x27;t hosting a network service. An adversary often combines various techniques in order to gain a more complete picture of the firewall filtering mechanisms in place for a host.</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary requires logical access to the target&#x27;s network in order to carry out this type of attack.</td></tr><tr><th>capec_Resources_Required</th><td>The adversary requires a network mapping/scanning tool, or must conduct socket programming on the command line. Packet injection tools are also useful for this purpose. Depending upon the method used it may be necessary to sniff the network in order to see the response.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_4": "<table class='meta-table'><tr><th>technique_name</th><td>System Network Configuration Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may look for details about the network configuration and settings, such as IP and/or MAC addresses, of systems they access or through information discovery of remote systems. Several operating system administration utilities exist that can be used to gather this information. Examples include [Arp](https://attack.mitre.org/software/S0099), [ipconfig](https://attack.mitre.org/software/S0100)/[ifconfig](https://attack.mitre.org/software/S0101), [nbtstat](https://attack.mitre.org/software/S0102), and [route](https://attack.mitre.org/software/S0103).\n\nAdversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather information about configurations and settings, such as IP addresses of configured interfaces and static/dynamic routes (e.g. &lt;code&gt;show ip route&lt;/code&gt;, &lt;code&gt;show ip interface&lt;/code&gt;).(Citation: US-CERT-TA18-106A)(Citation: Mandiant APT41 Global Intrusion )\n\nAdversaries may use the information from [System Network Configuration Discovery](https://attack.mitre.org/techniques/T1016) during automated discovery to shape follow-on behaviors, including determining certain access within the target network and what actions to do next.</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, {{LinkById|T1059.008} commands may also be used to gather system and network information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use  commands being run by non-standard users from non-standard locations.  Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation, Script: Script Execution</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_4": "<table class='meta-table'><tr><th>capec_Name</th><td>Network Topology Mapping</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1016 - System Network Configuration Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>An adversary engages in scanning activities to map network nodes, hosts, devices, and routes. Adversaries usually perform this type of network reconnaissance during the early stages of attack against an external network. Many types of scanning utilities are typically employed, including ICMP tools, network mappers, port scanners, and route testing utilities such as traceroute.</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Resources_Required</th><td>Probing requires the ability to interactively send and receive data from a target, whereas passive listening requires a sufficient understanding of the protocol to analyze a preexisting channel of communication.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_5": "<table class='meta-table'><tr><th>technique_name</th><td>System Network Connections Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to get a listing of network connections to or from the compromised system they are currently accessing or from remote systems by querying for information over the network. \n\nAn adversary who gains access to a system that is part of a cloud-based environment may map out Virtual Private Clouds or Virtual Networks in order to determine what systems and services are connected. The actions performed are likely the same types of discovery techniques depending on the operating system, but the resulting information may include details about the networked cloud environment relevant to the adversary&#x27;s goals. Cloud providers may have different ways in which their virtual networks operate.(Citation: Amazon AWS VPC Guide)(Citation: Microsoft Azure Virtual Network Overview)(Citation: Google VPC Overview) Similarly, adversaries who gain access to network devices may also perform similar discovery activities to gather information about connected systems and services.\n\nUtilities and commands that acquire this information include [netstat](https://attack.mitre.org/software/S0104), &quot;net use,&quot; and &quot;net session&quot; with [Net](https://attack.mitre.org/software/S0039). In Mac and Linux, [netstat](https://attack.mitre.org/software/S0104) and &lt;code&gt;lsof&lt;/code&gt; can be used to list current connections. &lt;code&gt;who -a&lt;/code&gt; and &lt;code&gt;w&lt;/code&gt; can be used to show which users are currently logged in, similar to &quot;net session&quot;. Additionally, built-in features native to network devices and [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) may be used (e.g. &lt;code&gt;show ip sockets&lt;/code&gt;, &lt;code&gt;show tcp brief&lt;/code&gt;).(Citation: US-CERT-TA18-106A)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather system and network information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use commands being run by non-standard users from non-standard locations. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).</td></tr><tr><th>platforms</th><td>IaaS, Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_5": "<table class='meta-table'><tr><th>capec_Name</th><td>Network Topology Mapping</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1049 - System Network Connections Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>An adversary engages in scanning activities to map network nodes, hosts, devices, and routes. Adversaries usually perform this type of network reconnaissance during the early stages of attack against an external network. Many types of scanning utilities are typically employed, including ICMP tools, network mappers, port scanners, and route testing utilities such as traceroute.</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Resources_Required</th><td>Probing requires the ability to interactively send and receive data from a target, whereas passive listening requires a sufficient understanding of the protocol to analyze a preexisting channel of communication.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_6": "<table class='meta-table'><tr><th>technique_name</th><td>System Information Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>An adversary may attempt to get detailed information about the operating system and hardware, including version, patches, hotfixes, service packs, and architecture. Adversaries may use the information from [System Information Discovery](https://attack.mitre.org/techniques/T1082) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nTools such as [Systeminfo](https://attack.mitre.org/software/S0096) can be used to gather detailed system information. If running with privileged access, a breakdown of system data can be gathered through the &lt;code&gt;systemsetup&lt;/code&gt; configuration tool on macOS. As an example, adversaries with user-level access can execute the &lt;code&gt;df -aH&lt;/code&gt; command to obtain currently mounted disks and associated freely available space. Adversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather detailed system information (e.g. &lt;code&gt;show version&lt;/code&gt;).(Citation: US-CERT-TA18-106A) [System Information Discovery](https://attack.mitre.org/techniques/T1082) combined with information gathered from other forms of discovery and reconnaissance can drive payload development and concealment.(Citation: OSX.FairyTale)(Citation: 20 macOS Common Tools and Techniques)\n\nInfrastructure as a Service (IaaS) cloud providers such as AWS, GCP, and Azure allow access to instance and virtual machine information via APIs. Successful authenticated API calls can return data such as the operating system platform and status of a particular instance or the model view of a virtual machine.(Citation: Amazon Describe Instance)(Citation: Google Instances Resource)(Citation: Microsoft Virutal Machine API)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather  detailed system information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use  commands being run by non-standard users from non-standard locations. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nIn cloud-based systems, native logging can be used to identify access to certain APIs and dashboards that may contain system information. Depending on how the environment is used, that data alone may not be useful due to benign use during normal operations.</td></tr><tr><th>platforms</th><td>IaaS, Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_6": "<table class='meta-table'><tr><th>capec_Name</th><td>Active OS Fingerprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1082 - System Information Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary engages in activity to detect the operating system or firmware version of a remote target by interrogating a device, server, or platform with a probe designed to solicit behavior that will reveal information about the operating systems or firmware in the environment. Operating System detection is possible because implementations of common protocols (Such as IP or TCP) differ in distinct ways. While the implementation differences are not sufficient to &#x27;break&#x27; compatibility with the protocol the differences are detectable because the target will respond in unique ways to specific probing activity that breaks the semantic or logical rules of packet construction for a protocol. Different operating systems will have a unique response to the anomalous input, providing the basis to fingerprint the OS behavior. This type of OS fingerprinting can distinguish between operating system types and versions.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Medium</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The ability to monitor and interact with network communications.Access to at least one host, and the privileges to interface with the network interface card.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Hide Activities</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_7": "<table class='meta-table'><tr><th>technique_name</th><td>System Information Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>An adversary may attempt to get detailed information about the operating system and hardware, including version, patches, hotfixes, service packs, and architecture. Adversaries may use the information from [System Information Discovery](https://attack.mitre.org/techniques/T1082) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nTools such as [Systeminfo](https://attack.mitre.org/software/S0096) can be used to gather detailed system information. If running with privileged access, a breakdown of system data can be gathered through the &lt;code&gt;systemsetup&lt;/code&gt; configuration tool on macOS. As an example, adversaries with user-level access can execute the &lt;code&gt;df -aH&lt;/code&gt; command to obtain currently mounted disks and associated freely available space. Adversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather detailed system information (e.g. &lt;code&gt;show version&lt;/code&gt;).(Citation: US-CERT-TA18-106A) [System Information Discovery](https://attack.mitre.org/techniques/T1082) combined with information gathered from other forms of discovery and reconnaissance can drive payload development and concealment.(Citation: OSX.FairyTale)(Citation: 20 macOS Common Tools and Techniques)\n\nInfrastructure as a Service (IaaS) cloud providers such as AWS, GCP, and Azure allow access to instance and virtual machine information via APIs. Successful authenticated API calls can return data such as the operating system platform and status of a particular instance or the model view of a virtual machine.(Citation: Amazon Describe Instance)(Citation: Google Instances Resource)(Citation: Microsoft Virutal Machine API)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather  detailed system information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use  commands being run by non-standard users from non-standard locations. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nIn cloud-based systems, native logging can be used to identify access to certain APIs and dashboards that may contain system information. Depending on how the environment is used, that data alone may not be useful due to benign use during normal operations.</td></tr><tr><th>platforms</th><td>IaaS, Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_7": "<table class='meta-table'><tr><th>capec_Name</th><td>Passive OS Fingerprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1082 - System Information Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary engages in activity to detect the version or type of OS software in a an environment by passively monitoring communication between devices, nodes, or applications. Passive techniques for operating system detection send no actual probes to a target, but monitor network or client-server communication between nodes in order to identify operating systems based on observed behavior as compared to a database of known signatures or values. While passive OS fingerprinting is not usually as reliable as active methods, it is generally better able to evade detection.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The ability to monitor network communications.Access to at least one host, and the privileges to interface with the network interface card.</td></tr><tr><th>capec_Resources_Required</th><td>Any tool capable of monitoring network communications, like a packet sniffer (e.g., Wireshark)</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Hide Activities</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_8": "<table class='meta-table'><tr><th>technique_name</th><td>File and Directory Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may enumerate files and directories or may search in specific locations of a host or network share for certain information within a file system. Adversaries may use the information from [File and Directory Discovery](https://attack.mitre.org/techniques/T1083) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nMany command shell utilities can be used to obtain this information. Examples include &lt;code&gt;dir&lt;/code&gt;, &lt;code&gt;tree&lt;/code&gt;, &lt;code&gt;ls&lt;/code&gt;, &lt;code&gt;find&lt;/code&gt;, and &lt;code&gt;locate&lt;/code&gt;.(Citation: Windows Commands JPCERT) Custom tools may also be used to gather file and directory information and interact with the [Native API](https://attack.mitre.org/techniques/T1106). Adversaries may also leverage a [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) on network devices to gather file and directory information (e.g. &lt;code&gt;dir&lt;/code&gt;, &lt;code&gt;show flash&lt;/code&gt;, and/or &lt;code&gt;nvram&lt;/code&gt;).(Citation: US-CERT-TA18-106A)\n\nSome files and directories may require elevated or specific user permissions to access.</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Collection and Exfiltration, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001). Further, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands may also be used to gather file and directory information with built-in features native to the network device platform.  Monitor CLI activity for unexpected or unauthorized use of commands being run by non-standard users from non-standard locations.</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_8": "<table class='meta-table'><tr><th>capec_Name</th><td>File Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1083 - File and Directory Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>An adversary engages in probing and exploration activities to determine if common key files exists. Such files often contain configuration and security parameters of the targeted application, system or network. Using this knowledge may often pave the way for more damaging attacks.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Very Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must know the location of these common key files.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data</td></tr><tr><th>capec_Mitigations</th><td>Leverage file protection mechanisms to render these files accessible only to authorized parties.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_9": "<table class='meta-table'><tr><th>technique_name</th><td>Process Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to get information about running processes on a system. Information obtained could be used to gain an understanding of common software/applications running on systems within the network. Administrator or otherwise elevated access may provide better process details. Adversaries may use the information from [Process Discovery](https://attack.mitre.org/techniques/T1057) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nIn Windows environments, adversaries could obtain details on running processes using the [Tasklist](https://attack.mitre.org/software/S0057) utility via [cmd](https://attack.mitre.org/software/S0106) or &lt;code&gt;Get-Process&lt;/code&gt; via [PowerShell](https://attack.mitre.org/techniques/T1059/001). Information about processes can also be extracted from the output of [Native API](https://attack.mitre.org/techniques/T1106) calls such as &lt;code&gt;CreateToolhelp32Snapshot&lt;/code&gt;. In Mac and Linux, this is accomplished with the &lt;code&gt;ps&lt;/code&gt; command. Adversaries may also opt to enumerate processes via `/proc`. \n\nOn network devices, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `show processes` can be used to display current running processes.(Citation: US-CERT-TA18-106A)(Citation: show_processes_cisco_cmd)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events that look like process discovery may be uncommon, depending on the environment and how they are used. Monitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nFor network infrastructure devices, collect AAA logging to monitor for `show` commands being run by non-standard users from non-standard locations.</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_9": "<table class='meta-table'><tr><th>capec_Name</th><td>Process Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1057 - Process Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary exploits functionality meant to identify information about the currently running processes on the target system to an authorized user. By knowing what processes are running on the target system, the adversary can learn about the target environment as a means towards further malicious behavior.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Identify programs that may be used to acquire process information and block them by using a software restriction policy or tools that restrict program execution by using a process allowlist.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_10": "<table class='meta-table'><tr><th>technique_name</th><td>System Service Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may try to gather information about registered local system services. Adversaries may obtain information about services using tools as well as OS utility commands such as &lt;code&gt;sc query&lt;/code&gt;, &lt;code&gt;tasklist /svc&lt;/code&gt;, &lt;code&gt;systemctl --type=service&lt;/code&gt;, and &lt;code&gt;net start&lt;/code&gt;.\n\nAdversaries may use the information from [System Service Discovery](https://attack.mitre.org/techniques/T1007) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system information related to services. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).</td></tr><tr><th>platforms</th><td>Linux, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_10": "<table class='meta-table'><tr><th>capec_Name</th><td>Services Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1007 - System Service Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr
