><tr><th>capec_Description</th><td>An adversary exploits functionality meant to identify information about the services on the target system to an authorized user. By knowing what services are registered on the target system, the adversary can learn about the target environment as a means towards further malicious behavior. Depending on the operating system, commands that can obtain services information include &quot;sc&quot; and &quot;tasklist/svc&quot; using Tasklist, and &quot;net start&quot; using Net.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Identify programs that may be used to acquire service information and block them by using a software restriction policy or tools that restrict program execution by uaing a process allowlist.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_11": "<table class='meta-table'><tr><th>technique_name</th><td>Account Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to get a listing of valid accounts, usernames, or email addresses on a system or within a compromised environment. This information can help adversaries determine which accounts exist, which can aid in follow-on behavior such as brute-forcing, spear-phishing attacks, or account takeovers (e.g., [Valid Accounts](https://attack.mitre.org/techniques/T1078)).\n\nAdversaries may use several methods to enumerate accounts, including abuse of existing tools, built-in commands, and potential misconfigurations that leak account names and roles or permissions in the targeted environment.\n\nFor examples, cloud environments typically provide easily accessible interfaces to obtain user lists.(Citation: AWS List Users)(Citation: Google Cloud - IAM Servie Accounts List API) On hosts, adversaries can use default [PowerShell](https://attack.mitre.org/techniques/T1059/001) and other command line functionality to identify accounts. Information about email addresses and accounts may also be extracted by searching an infected system\u2019s files.</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nMonitor for processes that can be used to enumerate user accounts, such as &lt;code&gt;net.exe&lt;/code&gt; and &lt;code&gt;net1.exe&lt;/code&gt;, especially when executed in quick succession.(Citation: Elastic - Koadiac Detection with EQL)</td></tr><tr><th>platforms</th><td>IaaS, Identity Provider, Linux, Office Suite, SaaS, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, File: File Access, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_11": "<table class='meta-table'><tr><th>capec_Name</th><td>Account Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1087 - Account Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary exploits functionality meant to identify information about the domain accounts and their permissions on the target system to an authorized user. By knowing what accounts are registered on the target system, the adversary can inform further and more targeted malicious behavior. Example Windows commands which can acquire this information are: &quot;net user&quot; and &quot;dsquery&quot;.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Identify programs that may be used to acquire account information and block them by using a software restriction policy or tools that restrict program execution by uysing a process allowlist.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_12": "<table class='meta-table'><tr><th>technique_name</th><td>Permission Groups Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to discover group and permission settings. This information can help adversaries determine which user accounts and groups are available, the membership of users in particular groups, and which users and groups have elevated permissions.\n\nAdversaries may attempt to discover group permission settings in many different ways. This data may provide the adversary with information about the compromised environment that can be used in follow-on activity and targeting.(Citation: CrowdStrike BloodHound April 2018)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001). Monitor container logs for commands and/or API calls related to listing permissions for pods and nodes, such as &lt;code&gt;kubectl auth can-i&lt;/code&gt;.(Citation: K8s Authorization Overview)</td></tr><tr><th>platforms</th><td>Containers, IaaS, Identity Provider, Linux, Office Suite, SaaS, Windows, macOS</td></tr><tr><th>data sources</th><td>Application Log: Application Log Content, Command: Command Execution, Group: Group Enumeration, Group: Group Metadata, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_12": "<table class='meta-table'><tr><th>capec_Name</th><td>Group Permission Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1069 - Permission Groups Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary exploits functionality meant to identify information about user groups and their permissions on the target system to an authorized user. By knowing what users/permissions are registered on the target system, the adversary can inform further and more targeted malicious behavior. An example Windows command which can list local groups is &quot;net localgroup&quot;.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Identify programs (such as &quot;net&quot;) that may be used to enumerate local group permissions and block them by using a software restriction Policy or tools that restrict program execution by using a process allowlist.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_13": "<table class='meta-table'><tr><th>technique_name</th><td>Group Policy Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may gather information on Group Policy settings to identify paths for privilege escalation, security measures applied within a domain, and to discover patterns in domain objects that can be manipulated or used to blend in the environment. Group Policy allows for centralized management of user and computer settings in Active Directory (AD). Group policy objects (GPOs) are containers for group policy settings made up of files stored within a predictable network path `\\&lt;DOMAIN&gt;\\SYSVOL\\&lt;DOMAIN&gt;\\Policies\\`.(Citation: TechNet Group Policy Basics)(Citation: ADSecurity GPO Persistence 2016)\n\nAdversaries may use commands such as &lt;code&gt;gpresult&lt;/code&gt; or various publicly available PowerShell functions, such as &lt;code&gt;Get-DomainGPO&lt;/code&gt; and &lt;code&gt;Get-DomainGPOLocalGroup&lt;/code&gt;, to gather information on Group Policy settings.(Citation: Microsoft gpresult)(Citation: Github PowerShell Empire) Adversaries may use this information to shape follow-on behaviors, including determining potential attack paths within the target network as well as opportunities to manipulate Group Policy settings (i.e. [Domain or Tenant Policy Modification](https://attack.mitre.org/techniques/T1484)) for their benefit.</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor for suspicious use of &lt;code&gt;gpresult&lt;/code&gt;. Monitor for the use of PowerShell functions such as &lt;code&gt;Get-DomainGPO&lt;/code&gt; and &lt;code&gt;Get-DomainGPOLocalGroup&lt;/code&gt; and processes spawning with command-line arguments containing &lt;code&gt;GPOLocalGroup&lt;/code&gt;.\n\nMonitor for abnormal LDAP queries with filters for &lt;code&gt;groupPolicyContainer&lt;/code&gt; and high volumes of LDAP traffic to domain controllers. Windows Event ID 4661 can also be used to detect when a directory service has been accessed.</td></tr><tr><th>platforms</th><td>Windows</td></tr><tr><th>data sources</th><td>Active Directory: Active Directory Object Access, Command: Command Execution, Network Traffic: Network Traffic Content, Process: Process Creation, Script: Script Execution</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_13": "<table class='meta-table'><tr><th>capec_Name</th><td>Group Permission Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1615 - Group Policy Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary exploits functionality meant to identify information about user groups and their permissions on the target system to an authorized user. By knowing what users/permissions are registered on the target system, the adversary can inform further and more targeted malicious behavior. An example Windows command which can list local groups is &quot;net localgroup&quot;.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must have gained access to the target system via physical or logical means in order to carry out this attack.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Identify programs (such as &quot;net&quot;) that may be used to enumerate local group permissions and block them by using a software restriction Policy or tools that restrict program execution by using a process allowlist.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_14": "<table class='meta-table'><tr><th>technique_name</th><td>System Owner/User Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to identify the primary user, currently logged in user, set of users that commonly uses a system, or whether a user is actively using the system. They may do this, for example, by retrieving account usernames or by using [OS Credential Dumping](https://attack.mitre.org/techniques/T1003). The information may be collected in a number of different ways using other Discovery techniques, because user and username details are prevalent throughout a system and include running process ownership, file/directory ownership, session information, and system logs. Adversaries may use the information from [System Owner/User Discovery](https://attack.mitre.org/techniques/T1033) during automated discovery to shape follow-on behaviors, including whether or not the adversary fully infects the target and/or attempts specific actions.\n\nVarious utilities and commands may acquire this information, including &lt;code&gt;whoami&lt;/code&gt;. In macOS and Linux, the currently logged in user can be identified with &lt;code&gt;w&lt;/code&gt; and &lt;code&gt;who&lt;/code&gt;. On macOS the &lt;code&gt;dscl . list /Users | grep -v &#x27;_&#x27;&lt;/code&gt; command can also be used to enumerate user accounts. Environment variables, such as &lt;code&gt;%USERNAME%&lt;/code&gt; and &lt;code&gt;$USER&lt;/code&gt;, may also be used to access this information.\n\nOn network devices, [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `show users` and `show ssh` can be used to display users currently logged into the device.(Citation: show_ssh_users_cmd_cisco)(Citation: US-CERT TA18-106A Network Infrastructure Devices 2018)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>`System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nFor network infrastructure devices, collect AAA logging to monitor `show` commands being run by non-standard users from non-standard locations.</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Active Directory: Active Directory Object Access, Command: Command Execution, File: File Access, Network Traffic: Network Traffic Content, Network Traffic: Network Traffic Flow, Process: OS API Execution, Process: Process Access, Process: Process Creation, Windows Registry: Windows Registry Key Access</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_14": "<table class='meta-table'><tr><th>capec_Name</th><td>Owner Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1033 - System Owner/User Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>An adversary exploits functionality meant to identify information about the primary users on the target system to an authorized user. They may do this, for example, by reviewing logins or file modification times. By knowing what owners use the target system, the adversary can inform further and more targeted malicious behavior. An example Windows command that may accomplish this is &quot;dir /A ntuser.dat&quot;. Which will display the last modified time of a user&#x27;s ntuser.dat file when run within the root folder of a user. This time is synonymous with the last time that user was logged in.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must have gained access to the target system via physical or logical means in order to carry out this attack. || Administrator permissions are required to view the home folder of other users.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Ensure that proper permissions on files and folders are enacted to limit accessibility.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_15": "<table class='meta-table'><tr><th>technique_name</th><td>Network Share Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may look for folders and drives shared on remote systems as a means of identifying sources of information to gather as a precursor for Collection and to identify potential systems of interest for Lateral Movement. Networks often contain shared network drives and folders that enable users to access file directories on various systems across a network. \n\nFile sharing over a Windows network occurs over the SMB protocol. (Citation: Wikipedia Shared Resource) (Citation: TechNet Shared Folder) [Net](https://attack.mitre.org/software/S0039) can be used to query a remote system for available shared drives using the &lt;code&gt;net view \\\\\\\\remotesystem&lt;/code&gt; command. It can also be used to query shared drives on the local system using &lt;code&gt;net share&lt;/code&gt;. For macOS, the &lt;code&gt;sharing -l&lt;/code&gt; command lists all shared points used for smb services.</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events related to legitimate remote system discovery may be uncommon, depending on the environment and how they are used. Monitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).</td></tr><tr><th>platforms</th><td>Linux, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_15": "<table class='meta-table'><tr><th>capec_Name</th><td>Identify Shared Files/Directories on System</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1135 - Network Share Discovery</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>An adversary discovers connections between systems by exploiting the target system&#x27;s standard practice of revealing them in searchable, common areas. Through the identification of shared folders/drives between systems, the adversary may further their goals of locating and collecting sensitive information/files, or map potential routes for lateral movement within the network.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Medium</td></tr><tr><th>capec_Typical_Severity</th><td>Medium</td></tr><tr><th>capec_Prerequisites</th><td>The adversary must have obtained logical access to the system by some means (e.g., via obtained credentials or planting malware on the system).</td></tr><tr><th>capec_Skills_Required</th><td>Low: Once the adversary has logical access (which can potentially require high knowledge and skill level), the adversary needs only the capability and facility to navigate the system through the OS graphical user interface or the command line. The adversary, or their malware, can simply employ a set of commands that search for shared drives on the system (e.g., net view \\\\remote system or net share).</td></tr><tr><th>capec_Resources_Required</th><td>None: No specialized resources are required to execute this type of attack.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data</td></tr><tr><th>capec_Mitigations</th><td>Identify unnecessary system utilities or potentially malicious software that may contain functionality to identify network share information, and audit and/or block them by using allowlist tools.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-267, CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_tech_16": "<table class='meta-table'><tr><th>technique_name</th><td>Peripheral Device Discovery</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to gather information about attached peripheral devices and components connected to a computer system.(Citation: Peripheral Discovery Linux)(Citation: Peripheral Discovery macOS) Peripheral devices could include auxiliary resources that support a variety of functionalities such as keyboards, printers, cameras, smart card readers, or removable storage. The information may be used to enhance their awareness of the system and network environment or may be used for further actions.</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).</td></tr><tr><th>platforms</th><td>Linux, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: OS API Execution, Process: Process Creation</td></tr><tr><th>permissions required</th><td>Administrator, SYSTEM, User</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_0_cap_16": "<table class='meta-table'><tr><th>capec_Name</th><td>Peripheral Footprinting</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1120 - Peripheral Device Discovery</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>Adversaries may attempt to obtain information about attached peripheral devices and components connected to a computer system. Examples may include discovering the presence of iOS devices by searching for backups, analyzing the Windows registry to determine what USB devices have been connected, or infecting a victim system with malware to report when a USB device has been connected. This may allow the adversary to gain additional insight about the system or network environment, which may be useful in constructing further attacks.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>Medium</td></tr><tr><th>capec_Prerequisites</th><td>The adversary needs either physical or remote access to the victim system.</td></tr><tr><th>capec_Skills_Required</th><td>Medium: The adversary needs to be able to infect the victim system in a manner that gives them remote access. || Medium: If analyzing the Windows registry, the adversary must understand the registry structure to know where to look for devices.</td></tr><tr><th>capec_Mitigations</th><td>Identify programs that may be used to acquire peripheral information and block them by using a software restriction policy or tools that restrict program execution by using a process allowlist.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t5_cwe_1": "<table class='meta-table'><tr><th>cwe_Name</th><td>Improper Authentication</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.</td></tr><tr><th>cwe_Abstraction</th><td>Class</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Draft</td></tr><tr><th>cwe_Description</th><td>When an actor claims to have a given identity, the product does not prove or insufficiently proves that the claim is correct.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-284 (ChildOf, View: 1000, Ordinal: Primary); CWE-284 (ChildOf, View: 1340, Ordinal: Primary)</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Architecture and Design: N/A | Implementation: REALIZATION: This weakness is caused during implementation of an architectural security tactic.</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Integrity, Confidentiality, Availability, Access Control | Impact: Read Application Data, Gain Privileges or Assume Identity, Execute Unauthorized Code or Commands | Note: This weakness can lead to the exposure of resources or functionality to unintended actors, possibly providing attackers with sensitive information or even execute arbitrary code.</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Automated Static Analysis | Effectiveness: Limited | Description:  || Method: Manual Static Analysis | Effectiveness: High | Description:  || Method: Manual Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis | Effectiveness: SOAR Partial | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Architecture and Design | Description: N/A</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>HIGH</td></tr><tr><th>exploitabilityScore</th><td>3.9</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t5_1_tech_17": "<table class='meta-table'><tr><th>technique_name</th><td>Network Sniffing</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.</td></tr><tr><th>tech_description</th><td>Adversaries may passively sniff network traffic to capture information about an environment, including authentication material passed over the network. Network sniffing refers to using the network interface on a system to monitor or capture information sent over a wired or wireless connection. An adversary may place a network interface into promiscuous mode to passively access data in transit over the network, or use span ports to capture a larger amount of data.\n\nData captured via this technique may include user credentials, especially those sent over an insecure, unencrypted protocol. Techniques for name service resolution poisoning, such as [LLMNR/NBT-NS Poisoning and SMB Relay](https://attack.mitre.org/techniques/T1557/001), can also be used to capture credentials to websites, proxies, and internal systems by redirecting traffic to an adversary.\n\nNetwork sniffing may reveal configuration details, such as running services, version numbers, and other network characteristics (e.g. IP addresses, hostnames, VLAN IDs) necessary for subsequent [Lateral Movement](https://attack.mitre.org/tactics/TA0008) and/or [Defense Evasion](https://attack.mitre.org/tactics/TA0005) activities. Adversaries may likely also utilize network sniffing during [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) (AiTM) to passively gain additional knowledge about the environment.\n\nIn cloud-based environments, adversaries may still be able to use traffic mirroring services to sniff network traffic from virtual machines. For example, AWS Traffic Mirroring, GCP Packet Mirroring, and Azure vTap allow users to define specified instances to collect traffic from and specified targets to send collected traffic to.(Citation: AWS Traffic Mirroring)(Citation: GCP Packet Mirroring)(Citation: Azure Virtual Network TAP) Often, much of this traffic will be in cleartext due to the use of TLS termination at the load balancer level to reduce the strain of encrypting and decrypting traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)(Citation: SpecterOps AWS Traffic Mirroring) The adversary can then use exfiltration techniques such as Transfer Data to Cloud Account in order to access the sniffed traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)\n\nOn network devices, adversaries may perform network captures using [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `monitor capture`.(Citation: US-CERT-TA18-106A)(Citation: capture_embedded_packet_on_software)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>Detecting the events leading up to sniffing network traffic may be the best method of detection. From the host level, an adversary would likely need to perform a [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) attack against other devices on a wired network in order to capture traffic that was not to or from the current compromised system. This change in the flow of information is detectable at the enclave network level. Monitor for ARP spoofing and gratuitous ARP broadcasts. Detecting compromised network devices is a bit more challenging. Auditing administrator logins, configuration changes, and device images is required to detect malicious changes.\n\nIn cloud-based environments, monitor for the creation of new traffic mirrors or modification of existing traffic mirrors. For network infrastructure devices, collect AAA logging to monitor for the capture of network traffic.</td></tr><tr><th>platforms</th><td>IaaS, Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t5_1_cap_17": "<table class='meta-table'><tr><th>capec_Name</th><td>Utilizing REST&#x27;s Trust in the System Resource to Obtain Sensitive Data</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1040 - Network Sniffing</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>This attack utilizes a REST(REpresentational State Transfer)-style applications&#x27; trust in the system resources and environment to obtain sensitive data once SSL is terminated.</td></tr><tr><th>capec_Extended_Description</th><td>Rest applications premise is that they leverage existing infrastructure to deliver web services functionality. An example of this is a Rest application that uses HTTP Get methods and receives a HTTP response with an XML document. These Rest style web services are deployed on existing infrastructure such as Apache and IIS web servers with no SOAP stack required. \n             Unfortunately from a security standpoint, there frequently is no interoperable identity security mechanism deployed, so Rest developers often fall back to SSL to deliver security. In large data centers, SSL is typically terminated at the edge of the network - at the firewall, load balancer, or router. Once the SSL is terminated the HTTP request is in the clear (unless developers have hashed or encrypted the values, but this is rare). The adversary can utilize a sniffer such as Wireshark to snapshot the credentials, such as username and password that are passed in the clear once SSL is terminated. Once the adversary gathers these credentials, they can submit requests to the web service provider just as authorized user do. There is not typically an authentication on the client side, beyond what is passed in the request itself so once this is compromised, then this is generally sufficient to compromise the service&#x27;s authentication scheme.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Medium</td></tr><tr><th>capec_Typical_Severity</th><td>Very High</td></tr><tr><th>capec_Execution_Flow</th><td>Step 1: Explore - [Find a REST-style application that uses SSL] The adversary must first find a REST-style application that uses SSL to target. Because this attack is easier to carry out from inside of a server network, it is likely that an adversary could have inside knowledge of how services operate. (Techniques: N/A) || Step 2: Experiment - [Insert a listener to sniff client-server communication] The adversary inserts a listener that must exist beyond the point where SSL is terminated. This can be placed on the client side if it is believed that sensitive information is being sent to the client as a response, although most often the listener will be placed on the server side to listen for client authentication information. (Techniques: Run wireshark or tcpdump on a device that is on the inside of a firewall, load balancer, or router of a network and capture traffic after SSL has been terminated) || Step 3: Exploit - [Gather information passed in the clear] If developers have not hashed or encrypted data sent in the sniffed request, the adversary will be able to read this data in the clear. Most commonly, they will now have a username or password that they can use to submit requests to the web service just as an authorized user (Techniques: N/A)</td></tr><tr><th>capec_Prerequisites</th><td>Opportunity to intercept must exist beyond the point where SSL is terminated. || The adversary must be able to insert a listener actively (proxying the communication) or passively (sniffing the communication) in the client-server communication path.</td></tr><tr><th>capec_Skills_Required</th><td>Low: To insert a network sniffer or other listener into the communication stream</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges</td></tr><tr><th>capec_Mitigations</th><td>Implementation: Implement message level security such as HMAC in the HTTP communication || Design: Utilize defense in depth, do not rely on a single security mechanism like SSL || Design: Enforce principle of least privilege</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-300, CWE-287, CWE-693</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t5_cwe_2": "<table class='meta-table'><tr><th>cwe_Name</th><td>Cleartext Transmission of Sensitive Information</td></tr><tr><th>CVE ID</th><td>CVE-2019-6845 | CVE-2019-6846</td></tr><tr><th>baseScore</th><td>7.5 | 6.5</td></tr><tr><th>baseSeverity</th><td>HIGH | MEDIUM</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information when transferring applications to the controller using Modbus TCP protocol. | A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon BMxCRA and 140CRA modules (all firmware versions), which could cause information disclosure when using the FTP protocol.</td></tr><tr><th>cwe_Abstraction</th><td>Base</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Draft</td></tr><tr><th>cwe_Description</th><td>The product transmits sensitive or security-critical data in cleartext in a communication channel that can be sniffed by unauthorized actors.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-311 (ChildOf, View: 1000, Ordinal: Primary); CWE-311 (ChildOf, View: 1003, Ordinal: Primary)</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Architecture and Design: OMISSION: This weakness is caused by missing a security tactic during the architecture and design phase. | Architecture and Design: For hardware, this may be introduced when design does not plan for an attacker having physical access while a legitimate user is remotely operating the device. | Operation: N/A | System Configuration: N/A</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Integrity, Confidentiality | Impact: Read Application Data, Modify Files or Directories | Note: Anyone can read the information by gaining access to the channel being used for communication.</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Black Box | Effectiveness: N/A | Description:  || Method: Automated Static Analysis | Effectiveness: High | Description: Automated static analysis, commonly referred to as Static Application Security Testing (SAST), can find some instances of this weakness by analyzing source code (or binary/compiled code) without having to execute it. Typically, this is done by building a model of data flow and control flow, then searching for potentially-vulnerable patterns that connect &quot;sources&quot; (origins of input) with &quot;sinks&quot; (destinations where the data interacts with external components, a lower layer such as the OS, etc.)</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Architecture and Design | Description: N/A || Phase: Implementation | Description: N/A || Phase: Implementation | Description: N/A || Phase: Testing | Description: N/A || Phase: Operation | Description: N/A</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE | REQUIRED</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>NONE</td></tr><tr><th>exploitabilityScore</th><td>3.9 | 2.8</td></tr><tr><th>exposure_tags</th><td>Cleartext, Modbus | Cleartext, FTP</td></tr></table>", "t5_2_tech_18": "<table class='meta-table'><tr><th>technique_name</th><td>Network Sniffing</td></tr><tr><th>CVE ID</th><td>CVE-2019-6845 | CVE-2019-6846</td></tr><tr><th>baseScore</th><td>7.5 | 6.5</td></tr><tr><th>baseSeverity</th><td>HIGH | MEDIUM</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information when transferring applications to the controller using Modbus TCP protocol. | A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon BMxCRA and 140CRA modules (all firmware versions), which could cause information disclosure when using the FTP protocol.</td></tr><tr><th>tech_description</th><td>Adversaries may passively sniff network traffic to capture information about an environment, including authentication material passed over the network. Network sniffing refers to using the network interface on a system to monitor or capture information sent over a wired or wireless connection. An adversary may place a network interface into promiscuous mode to passively access data in transit over the network, or use span ports to capture a larger amount of data.\n\nData captured via this technique may include user credentials, especially those sent over an insecure, unencrypted protocol. Techniques for name service resolution poisoning, such as [LLMNR/NBT-NS Poisoning and SMB Relay](https://attack.mitre.org/techniques/T1557/001), can also be used to capture credentials to websites, proxies, and internal systems by redirecting traffic to an adversary.\n\nNetwork sniffing may reveal configuration details, such as running services, version numbers, and other network characteristics (e.g. IP addresses, hostnames, VLAN IDs) necessary for subsequent [Lateral Movement](https://attack.mitre.org/tactics/TA0008) and/or [Defense Evasion](https://attack.mitre.org/tactics/TA0005) activities. Adversaries may likely also utilize network sniffing during [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) (AiTM) to passively gain additional knowledge about the environment.\n\nIn cloud-based environments, adversaries may still be able to use traffic mirroring services to sniff network traffic from virtual machines. For example, AWS Traffic Mirroring, GCP Packet Mirroring, and Azure vTap allow users to define specified instances to collect traffic from and specified targets to send collected traffic to.(Citation: AWS Traffic Mirroring)(Citation: GCP Packet Mirroring)(Citation: Azure Virtual Network TAP) Often, much of this traffic will be in cleartext due to the use of TLS termination at the load balancer level to reduce the strain of encrypting and decrypting traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)(Citation: SpecterOps AWS Traffic Mirroring) The adversary can then use exfiltration techniques such as Transfer Data to Cloud Account in order to access the sniffed traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)\n\nOn network devices, adversaries may perform network captures using [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `monitor capture`.(Citation: US-CERT-TA18-106A)(Citation: capture_embedded_packet_on_software)</td></tr><tr><th>tactics</th><td>Discovery</td></tr><tr><th>detection</th><td>Detecting the events leading up to sniffing network traffic may be the best method of detection. From the host level, an adversary would likely need to perform a [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) attack against other devices on a wired network in order to capture traffic that was not to or from the current compromised system. This change in the flow of information is detectable at the enclave network level. Monitor for ARP spoofing and gratuitous ARP broadcasts. Detecting compromised network devices is a bit more challenging. Auditing administrator logins, configuration changes, and device images is required to detect malicious changes.\n\nIn cloud-based environments, monitor for the creation of new traffic mirrors or modification of existing traffic mirrors. For network infrastructure devices, collect AAA logging to monitor for the capture of network traffic.</td></tr><tr><th>platforms</th><td>IaaS, Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, Process: Process Creation</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE | REQUIRED</td></tr><tr><th>exposure_tags</th><td>Cleartext, Modbus | Cleartext, FTP</td></tr></table>", "t5_2_cap_18": "<table class='meta-table'><tr><th>capec_Name</th><td>Sniff Application Code</td></tr><tr><th>CVE ID</th><td>CVE-2019-6845 | CVE-2019-6846</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1040 - Network Sniffing</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>An adversary passively sniffs network communications and captures application code bound for an authorized client. Once obtained, they can use it as-is, or through reverse-engineering glean sensitive information or exploit the trust relationship between the client and server. Such code may belong to a dynamic update to the client, a patch being applied to a client component or any such interaction where the client is authorized to communicate with the server.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>Low</td></tr><tr><th>capec_Typical_Severity</th><td>High</td></tr><tr><th>capec_Execution_Flow</th><td>Step 1: Explore - [Set up a sniffer] The adversary sets up a sniffer in the path between the server and the client and watches the traffic. (Techniques: The adversary sets up a sniffer in the path between the server and the client.) || Step 2: Exploit - [Capturing Application Code Bound During Patching]adversary knows that the computer/OS/application can request new applications to install, or it periodically checks for an available update. The adversary loads the sniffer set up during Explore phase, and extracts the application code from subsequent communication. The adversary then proceeds to reverse engineer the captured code. (Techniques: adversary loads the sniffer to capture the application code bound during a dynamic update., The adversary proceeds to reverse engineer the captured code.)</td></tr><tr><th>capec_Prerequisites</th><td>The attacker must have the ability to place themself in the communication path between the client and server. || The targeted application must receive some application code from the server; for example, dynamic updates, patches, applets or scripts. || The attacker must be able to employ a sniffer on the network without being detected.</td></tr><tr><th>capec_Skills_Required</th><td>Medium: The attacker needs to setup a sniffer for a sufficient period of time so as to capture meaningful quantities of code. The presence of the sniffer should not be detected on the network. Also if the attacker plans to employ an adversary-in-the-middle attack (CAPEC-94), the client or server must not realize this. Finally, the attacker needs to regenerate source code from binary code if the need be.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges</td></tr><tr><th>capec_Mitigations</th><td>Design: Encrypt all communication between the client and server. || Implementation: Use SSL, SSH, SCP. || Operation: Use &quot;ifconfig/ipconfig&quot; or other tools to detect the sniffer installed in the network.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-319, CWE-311, CWE-318, CWE-693</td></tr><tr><th>exposure_tags</th><td>Cleartext, Modbus | Cleartext, FTP</td></tr></table>"};
var NODES_DATA = [{"id": "t5_tactic", "label": "Discovery", "type": "tactic", "metadata": {"tactic": "Discovery"}}, {"id": "t5_cwe_0", "label": "Exposure of Sensitive Information to an Unauthorized Actor", "type": "cwe", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "cwe_Name": "Exposure of Sensitive Information to an Unauthorized Actor", "cwe_Abstraction": "Class", "cwe_Structure": "Simple", "cwe_Status": "Draft", "cwe_Description": "The product exposes sensitive information to an actor that is not explicitly authorized to have access to that information.", "cwe_Related_Weaknesses": "CWE-668 (ChildOf, View: 1000, Ordinal: Primary)", "cwe_Weakness_Ordinality": "Primary, Resultant", "cwe_Modes_Of_Introduction": "Architecture and Design: N/A | Implementation: N/A", "cwe_Likelihood_Of_Exploit": "High", "cwe_Common_Consequences": "Scope: Confidentiality | Impact: Read Application Data | Note: N/A", "cwe_Detection_Methods": "Method: Automated Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: High | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: High | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: High | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:", "cwe_Potential_Mitigations": "Phase: Architecture and Design | Description: Compartmentalize the system to have \"safe\" areas where trust boundaries can be unambiguously drawn. Do not allow sensitive data to go outside of the trust boundary and always be careful when interfacing with a compartment outside of the safe area. Ensure that appropriate compartmentalization is built into the system design, and the compartmentalization allows for and reinforces privilege separation functionality. Architects and designers should rely on the principle of least privilege to decide the appropriate time to use privileges and the time to drop privileges.", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "confidentialityImpact": "HIGH", "availabilityImpact": "NONE", "exploitabilityScore": "3.9", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_tech_0", "label": "Browser Information Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may enumerate information about browsers to learn more about compromised environments. Data saved by browsers (such as bookmarks, accounts, and browsing history) may reveal a variety of personal information about users (e.g., banking sites, relationships/interests, social media, etc.) as well as details about internal network resources such as servers, tools/dashboards, or other related infrastructure.(Citation: Kaspersky Autofill)\n\nBrowser information may also highlight additional targets after an adversary has access to valid credentials, especially [Credentials In Files](https://attack.mitre.org/techniques/T1552/001) associated with logins cached by a browser.\n\nSpecific storage locations vary based on platform and/or application, but browser information is typically stored in local files and databases (e.g., `%APPDATA%/Google/Chrome`).(Citation: Chrome Roaming Profiles)", "technique_name": "Browser Information Discovery", "tactics": "Discovery", "detection": "Monitor processes and command-line arguments for actions that could be taken to gather browser bookmark information. Remote access tools with built-in features may interact directly using APIs to gather information. Information may also be acquired through system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nSystem and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Collection and Exfiltration, based on the information obtained.", "platforms": "Linux, Windows, macOS", "data sources": "Command: Command Execution, File: File Access, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_0", "label": "Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Footprinting", "capec_Mitre_Techniques": "1217 - Browser Bookmark Discovery", "capec_Abstraction": "Meta", "capec_Status": "Stable", "capec_Description": "An adversary engages in probing and exploration activities to identify constituents and properties of the target.", "capec_Extended_Description": "Footprinting is a general term to describe a variety of information gathering techniques, often used by attackers in preparation for some attack. It consists of using tools to learn as much as possible about the composition, configuration, and security mechanisms of the targeted application, system or network. Information that might be collected during a footprinting effort could include open ports, applications and their versions, network topology, and similar information. Although similar to fingerprinting, footprinting aims to get a more holistic view of a system or network, whereas fingerprinting is more targeted to a specific application or operating system. While footprinting is not intended to be damaging (although certain activities, such as network scans, can sometimes cause disruptions to vulnerable applications inadvertently) it may often pave the way for more damaging attacks.", "capec_Likelihood_Of_Attack": "High", "capec_Typical_Severity": "Very Low", "capec_Execution_Flow": "Step 1: Explore - [Request Footprinting] The attacker examines the website information and source code of the website and uses automated tools to get as much information as possible about the system and organization. (Techniques: Open Source Footprinting: Examine the website about the organization and skim through the webpage's HTML source to look for comments., Network Enumeration: Perform various queries (Registrar Query, Organizational Query, Domain Query, Network Query, POC Query) on the many whois databases found on the internet to identify domain names and associated networks., DNS Interrogation: Once basic information is gathered the attack could begin to query DNS., Other Techniques: Use ping sweep, TCP scan, UDP scan, OS Identification various techniques to gain more information about the system and network.)", "capec_Prerequisites": "An application must publicize identifiable information about the system or application through voluntary or involuntary means. Certain identification details of information systems are visible on communication networks (e.g., if an adversary uses a sniffer to inspect the traffic) due to their inherent structure and protocol standards. Any system or network that can be detected can be footprinted. However, some configuration choices may limit the useful information that can be collected during a footprinting attack.", "capec_Skills_Required": "Low: The adversary knows how to send HTTP request, run the scan tool.", "capec_Resources_Required": "The adversary requires a variety of tools to collect information about the target. These include port/network scanners and tools to analyze responses from applications to determine version and configuration information. Footprinting a system adequately may also take a few days if the attacker wishes the footprinting attempt to go undetected.", "capec_Consequences": "Scope: Confidentiality | Impact: Read Data", "capec_Mitigations": "Keep patches up to date by installing weekly or daily if possible. || Shut down unnecessary services/ports. || Change default passwords by choosing strong passwords. || Curtail unexpected input. || Encrypt and password-protect sensitive data. || Avoid including information that has the potential to identify and compromise your organization's security such as access to business plans, formulas, and proprietary documents.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_0", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_1", "label": "Remote System Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to get a listing of other systems by IP address, hostname, or other logical identifier on a network that may be used for Lateral Movement from the current system. Functionality could exist within remote access tools to enable this, but utilities available on the operating system could also be used such as  [Ping](https://attack.mitre.org/software/S0097) or <code>net view</code> using [Net](https://attack.mitre.org/software/S0039).\n\nAdversaries may also analyze data from local host files (ex: <code>C:\\Windows\\System32\\Drivers\\etc\\hosts</code> or <code>/etc/hosts</code>) or other passive means (such as local [Arp](https://attack.mitre.org/software/S0099) cache entries) in order to discover the presence of remote systems in an environment.\n\nAdversaries may also target discovery of network infrastructure as well as leverage [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands on network devices to gather detailed information about systems within a network (e.g. <code>show cdp neighbors</code>, <code>show arp</code>).(Citation: US-CERT-TA18-106A)(Citation: CISA AR21-126A FIVEHANDS May 2021)", "technique_name": "Remote System Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as Lateral Movement, based on the information obtained.\n\nNormal, benign system and network events related to legitimate remote system discovery may be uncommon, depending on the environment and how they are used. Monitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).\n\nMonitor for processes that can be used to discover remote systems, such as <code>ping.exe</code> and <code>tracert.exe</code>, especially when executed in quick succession.(Citation: Elastic - Koadiac Detection with EQL)", "platforms": "Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, File: File Access, Network Traffic: Network Connection Creation, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_1", "label": "Host Discovery", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Host Discovery", "capec_Mitre_Techniques": "1018 - Remote System Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "An adversary sends a probe to an IP address to determine if the host is alive. Host discovery is one of the earliest phases of network reconnaissance. The adversary usually starts with a range of IP addresses belonging to a target network and uses various methods to determine if a host is present at that IP address. Host discovery is usually referred to as 'Ping' scanning using a sonar analogy. The goal is to send a packet through to the IP address and solicit a response from the host. As such, a 'ping' can be virtually any crafted packet whatsoever, provided the adversary can identify a functional host based on its response. An attack of this nature is usually carried out with a 'ping sweep,' where a particular kind of ping is sent to a range of IP addresses.", "capec_Typical_Severity": "Low", "capec_Prerequisites": "The adversary requires logical access to the target network in order to carry out host discovery.", "capec_Resources_Required": "The resources required will differ based upon the type of host discovery being performed. Usually a network scanning tool or scanning script is required due to the volume of requests that must be generated.", "capec_Consequences": "Scope: Confidentiality | Impact: Other || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism, Hide Activities", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_1", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_2", "label": "System Time Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP infor
