ion": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_15", "label": "Identify Shared Files/Directories on System", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Identify Shared Files/Directories on System", "capec_Mitre_Techniques": "1135 - Network Share Discovery", "capec_Abstraction": "Detailed", "capec_Status": "Draft", "capec_Description": "An adversary discovers connections between systems by exploiting the target system's standard practice of revealing them in searchable, common areas. Through the identification of shared folders/drives between systems, the adversary may further their goals of locating and collecting sensitive information/files, or map potential routes for lateral movement within the network.", "capec_Likelihood_Of_Attack": "Medium", "capec_Typical_Severity": "Medium", "capec_Prerequisites": "The adversary must have obtained logical access to the system by some means (e.g., via obtained credentials or planting malware on the system).", "capec_Skills_Required": "Low: Once the adversary has logical access (which can potentially require high knowledge and skill level), the adversary needs only the capability and facility to navigate the system through the OS graphical user interface or the command line. The adversary, or their malware, can simply employ a set of commands that search for shared drives on the system (e.g., net view \\\\remote system or net share).", "capec_Resources_Required": "None: No specialized resources are required to execute this type of attack.", "capec_Consequences": "Scope: Confidentiality | Impact: Read Data", "capec_Mitigations": "Identify unnecessary system utilities or potentially malicious software that may contain functionality to identify network share information, and audit and/or block them by using allowlist tools.", "capec_Related_Weaknesses": "CWE-267, CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_15", "label": "AND", "type": "gate"}, {"id": "t5_0_tech_16", "label": "Peripheral Device Discovery", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "Description": "A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.", "tech_description": "Adversaries may attempt to gather information about attached peripheral devices and components connected to a computer system.(Citation: Peripheral Discovery Linux)(Citation: Peripheral Discovery macOS) Peripheral devices could include auxiliary resources that support a variety of functionalities such as keyboards, printers, cameras, smart card readers, or removable storage. The information may be used to enhance their awareness of the system and network environment or may be used for further actions.", "technique_name": "Peripheral Device Discovery", "tactics": "Discovery", "detection": "System and network discovery techniques normally occur throughout an operation as an adversary learns the environment. Data and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities based on the information obtained.\n\nMonitor processes and command-line arguments for actions that could be taken to gather system and network information. Remote access tools with built-in features may interact directly with the Windows API to gather information. Information may also be acquired through Windows system management tools such as [Windows Management Instrumentation](https://attack.mitre.org/techniques/T1047) and [PowerShell](https://attack.mitre.org/techniques/T1059/001).", "platforms": "Linux, Windows, macOS", "data sources": "Command: Command Execution, Process: OS API Execution, Process: Process Creation", "permissions required": "Administrator, SYSTEM, User", "attackVector": "NETWORK", "baseScore": "7.5", "baseSeverity": "HIGH", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_cap_16", "label": "Peripheral Footprinting", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851", "capec_Name": "Peripheral Footprinting", "capec_Mitre_Techniques": "1120 - Peripheral Device Discovery", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "Adversaries may attempt to obtain information about attached peripheral devices and components connected to a computer system. Examples may include discovering the presence of iOS devices by searching for backups, analyzing the Windows registry to determine what USB devices have been connected, or infecting a victim system with malware to report when a USB device has been connected. This may allow the adversary to gain additional insight about the system or network environment, which may be useful in constructing further attacks.", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "Medium", "capec_Prerequisites": "The adversary needs either physical or remote access to the victim system.", "capec_Skills_Required": "Medium: The adversary needs to be able to infect the victim system in a manner that gives them remote access. || Medium: If analyzing the Windows registry, the adversary must understand the registry structure to know where to look for devices.", "capec_Mitigations": "Identify programs that may be used to acquire peripheral information and block them by using a software restriction policy or tools that restrict program execution by using a process allowlist.", "capec_Related_Weaknesses": "CWE-200", "attackVector": "NETWORK", "exposure_tags": "Modbus, SNMP | Modbus | TFTP"}}, {"id": "t5_0_and_16", "label": "AND", "type": "gate"}, {"id": "t5_cwe0_or", "label": "OR", "type": "gate"}, {"id": "t5_cwe_1", "label": "Improper Authentication", "type": "cwe", "metadata": {"CVE ID": "CVE-2018-7847", "Description": "A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.", "cwe_Name": "Improper Authentication", "cwe_Abstraction": "Class", "cwe_Structure": "Simple", "cwe_Status": "Draft", "cwe_Description": "When an actor claims to have a given identity, the product does not prove or insufficiently proves that the claim is correct.", "cwe_Related_Weaknesses": "CWE-284 (ChildOf, View: 1000, Ordinal: Primary); CWE-284 (ChildOf, View: 1340, Ordinal: Primary)", "cwe_Modes_Of_Introduction": "Architecture and Design: N/A | Implementation: REALIZATION: This weakness is caused during implementation of an architectural security tactic.", "cwe_Likelihood_Of_Exploit": "High", "cwe_Common_Consequences": "Scope: Integrity, Confidentiality, Availability, Access Control | Impact: Read Application Data, Gain Privileges or Assume Identity, Execute Unauthorized Code or Commands | Note: This weakness can lead to the exposure of resources or functionality to unintended actors, possibly providing attackers with sensitive information or even execute arbitrary code.", "cwe_Detection_Methods": "Method: Automated Static Analysis | Effectiveness: Limited | Description:  || Method: Manual Static Analysis | Effectiveness: High | Description:  || Method: Manual Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis | Effectiveness: SOAR Partial | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:", "cwe_Potential_Mitigations": "Phase: Architecture and Design | Description: N/A", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "confidentialityImpact": "HIGH", "availabilityImpact": "HIGH", "exploitabilityScore": "3.9", "exposure_tags": "Modbus"}}, {"id": "t5_1_tech_17", "label": "Network Sniffing", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7847", "Description": "A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.", "tech_description": "Adversaries may passively sniff network traffic to capture information about an environment, including authentication material passed over the network. Network sniffing refers to using the network interface on a system to monitor or capture information sent over a wired or wireless connection. An adversary may place a network interface into promiscuous mode to passively access data in transit over the network, or use span ports to capture a larger amount of data.\n\nData captured via this technique may include user credentials, especially those sent over an insecure, unencrypted protocol. Techniques for name service resolution poisoning, such as [LLMNR/NBT-NS Poisoning and SMB Relay](https://attack.mitre.org/techniques/T1557/001), can also be used to capture credentials to websites, proxies, and internal systems by redirecting traffic to an adversary.\n\nNetwork sniffing may reveal configuration details, such as running services, version numbers, and other network characteristics (e.g. IP addresses, hostnames, VLAN IDs) necessary for subsequent [Lateral Movement](https://attack.mitre.org/tactics/TA0008) and/or [Defense Evasion](https://attack.mitre.org/tactics/TA0005) activities. Adversaries may likely also utilize network sniffing during [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) (AiTM) to passively gain additional knowledge about the environment.\n\nIn cloud-based environments, adversaries may still be able to use traffic mirroring services to sniff network traffic from virtual machines. For example, AWS Traffic Mirroring, GCP Packet Mirroring, and Azure vTap allow users to define specified instances to collect traffic from and specified targets to send collected traffic to.(Citation: AWS Traffic Mirroring)(Citation: GCP Packet Mirroring)(Citation: Azure Virtual Network TAP) Often, much of this traffic will be in cleartext due to the use of TLS termination at the load balancer level to reduce the strain of encrypting and decrypting traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)(Citation: SpecterOps AWS Traffic Mirroring) The adversary can then use exfiltration techniques such as Transfer Data to Cloud Account in order to access the sniffed traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)\n\nOn network devices, adversaries may perform network captures using [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `monitor capture`.(Citation: US-CERT-TA18-106A)(Citation: capture_embedded_packet_on_software)", "technique_name": "Network Sniffing", "tactics": "Discovery", "detection": "Detecting the events leading up to sniffing network traffic may be the best method of detection. From the host level, an adversary would likely need to perform a [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) attack against other devices on a wired network in order to capture traffic that was not to or from the current compromised system. This change in the flow of information is detectable at the enclave network level. Monitor for ARP spoofing and gratuitous ARP broadcasts. Detecting compromised network devices is a bit more challenging. Auditing administrator logins, configuration changes, and device images is required to detect malicious changes.\n\nIn cloud-based environments, monitor for the creation of new traffic mirrors or modification of existing traffic mirrors. For network infrastructure devices, collect AAA logging to monitor for the capture of network traffic.", "platforms": "IaaS, Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus"}}, {"id": "t5_1_cap_17", "label": "Utilizing REST's Trust in the System Resource to Obtain Sensitive Data", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7847", "capec_Name": "Utilizing REST's Trust in the System Resource to Obtain Sensitive Data", "capec_Mitre_Techniques": "1040 - Network Sniffing", "capec_Abstraction": "Detailed", "capec_Status": "Draft", "capec_Description": "This attack utilizes a REST(REpresentational State Transfer)-style applications' trust in the system resources and environment to obtain sensitive data once SSL is terminated.", "capec_Extended_Description": "Rest applications premise is that they leverage existing infrastructure to deliver web services functionality. An example of this is a Rest application that uses HTTP Get methods and receives a HTTP response with an XML document. These Rest style web services are deployed on existing infrastructure such as Apache and IIS web servers with no SOAP stack required. \n             Unfortunately from a security standpoint, there frequently is no interoperable identity security mechanism deployed, so Rest developers often fall back to SSL to deliver security. In large data centers, SSL is typically terminated at the edge of the network - at the firewall, load balancer, or router. Once the SSL is terminated the HTTP request is in the clear (unless developers have hashed or encrypted the values, but this is rare). The adversary can utilize a sniffer such as Wireshark to snapshot the credentials, such as username and password that are passed in the clear once SSL is terminated. Once the adversary gathers these credentials, they can submit requests to the web service provider just as authorized user do. There is not typically an authentication on the client side, beyond what is passed in the request itself so once this is compromised, then this is generally sufficient to compromise the service's authentication scheme.", "capec_Likelihood_Of_Attack": "Medium", "capec_Typical_Severity": "Very High", "capec_Execution_Flow": "Step 1: Explore - [Find a REST-style application that uses SSL] The adversary must first find a REST-style application that uses SSL to target. Because this attack is easier to carry out from inside of a server network, it is likely that an adversary could have inside knowledge of how services operate. (Techniques: N/A) || Step 2: Experiment - [Insert a listener to sniff client-server communication] The adversary inserts a listener that must exist beyond the point where SSL is terminated. This can be placed on the client side if it is believed that sensitive information is being sent to the client as a response, although most often the listener will be placed on the server side to listen for client authentication information. (Techniques: Run wireshark or tcpdump on a device that is on the inside of a firewall, load balancer, or router of a network and capture traffic after SSL has been terminated) || Step 3: Exploit - [Gather information passed in the clear] If developers have not hashed or encrypted data sent in the sniffed request, the adversary will be able to read this data in the clear. Most commonly, they will now have a username or password that they can use to submit requests to the web service just as an authorized user (Techniques: N/A)", "capec_Prerequisites": "Opportunity to intercept must exist beyond the point where SSL is terminated. || The adversary must be able to insert a listener actively (proxying the communication) or passively (sniffing the communication) in the client-server communication path.", "capec_Skills_Required": "Low: To insert a network sniffer or other listener into the communication stream", "capec_Consequences": "Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges", "capec_Mitigations": "Implementation: Implement message level security such as HMAC in the HTTP communication || Design: Utilize defense in depth, do not rely on a single security mechanism like SSL || Design: Enforce principle of least privilege", "capec_Related_Weaknesses": "CWE-300, CWE-287, CWE-693", "attackVector": "NETWORK", "exposure_tags": "Modbus"}}, {"id": "t5_1_and_17", "label": "AND", "type": "gate"}, {"id": "t5_cwe_2", "label": "Cleartext Transmission of Sensitive Information", "type": "cwe", "metadata": {"CVE ID": "CVE-2019-6845 | CVE-2019-6846", "Description": "A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information when transferring applications to the controller using Modbus TCP protocol. | A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon BMxCRA and 140CRA modules (all firmware versions), which could cause information disclosure when using the FTP protocol.", "cwe_Name": "Cleartext Transmission of Sensitive Information", "cwe_Abstraction": "Base", "cwe_Structure": "Simple", "cwe_Status": "Draft", "cwe_Description": "The product transmits sensitive or security-critical data in cleartext in a communication channel that can be sniffed by unauthorized actors.", "cwe_Related_Weaknesses": "CWE-311 (ChildOf, View: 1000, Ordinal: Primary); CWE-311 (ChildOf, View: 1003, Ordinal: Primary)", "cwe_Modes_Of_Introduction": "Architecture and Design: OMISSION: This weakness is caused by missing a security tactic during the architecture and design phase. | Architecture and Design: For hardware, this may be introduced when design does not plan for an attacker having physical access while a legitimate user is remotely operating the device. | Operation: N/A | System Configuration: N/A", "cwe_Likelihood_Of_Exploit": "High", "cwe_Common_Consequences": "Scope: Integrity, Confidentiality | Impact: Read Application Data, Modify Files or Directories | Note: Anyone can read the information by gaining access to the channel being used for communication.", "cwe_Detection_Methods": "Method: Black Box | Effectiveness: N/A | Description:  || Method: Automated Static Analysis | Effectiveness: High | Description: Automated static analysis, commonly referred to as Static Application Security Testing (SAST), can find some instances of this weakness by analyzing source code (or binary/compiled code) without having to execute it. Typically, this is done by building a model of data flow and control flow, then searching for potentially-vulnerable patterns that connect \"sources\" (origins of input) with \"sinks\" (destinations where the data interacts with external components, a lower layer such as the OS, etc.)", "cwe_Potential_Mitigations": "Phase: Architecture and Design | Description: N/A || Phase: Implementation | Description: N/A || Phase: Implementation | Description: N/A || Phase: Testing | Description: N/A || Phase: Operation | Description: N/A", "attackVector": "NETWORK", "baseScore": "7.5 | 6.5", "baseSeverity": "HIGH | MEDIUM", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE | REQUIRED", "confidentialityImpact": "HIGH", "availabilityImpact": "NONE", "exploitabilityScore": "3.9 | 2.8", "exposure_tags": "Cleartext, Modbus | Cleartext, FTP"}}, {"id": "t5_2_tech_18", "label": "Network Sniffing", "type": "tech", "metadata": {"CVE ID": "CVE-2019-6845 | CVE-2019-6846", "Description": "A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information when transferring applications to the controller using Modbus TCP protocol. | A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon BMxCRA and 140CRA modules (all firmware versions), which could cause information disclosure when using the FTP protocol.", "tech_description": "Adversaries may passively sniff network traffic to capture information about an environment, including authentication material passed over the network. Network sniffing refers to using the network interface on a system to monitor or capture information sent over a wired or wireless connection. An adversary may place a network interface into promiscuous mode to passively access data in transit over the network, or use span ports to capture a larger amount of data.\n\nData captured via this technique may include user credentials, especially those sent over an insecure, unencrypted protocol. Techniques for name service resolution poisoning, such as [LLMNR/NBT-NS Poisoning and SMB Relay](https://attack.mitre.org/techniques/T1557/001), can also be used to capture credentials to websites, proxies, and internal systems by redirecting traffic to an adversary.\n\nNetwork sniffing may reveal configuration details, such as running services, version numbers, and other network characteristics (e.g. IP addresses, hostnames, VLAN IDs) necessary for subsequent [Lateral Movement](https://attack.mitre.org/tactics/TA0008) and/or [Defense Evasion](https://attack.mitre.org/tactics/TA0005) activities. Adversaries may likely also utilize network sniffing during [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) (AiTM) to passively gain additional knowledge about the environment.\n\nIn cloud-based environments, adversaries may still be able to use traffic mirroring services to sniff network traffic from virtual machines. For example, AWS Traffic Mirroring, GCP Packet Mirroring, and Azure vTap allow users to define specified instances to collect traffic from and specified targets to send collected traffic to.(Citation: AWS Traffic Mirroring)(Citation: GCP Packet Mirroring)(Citation: Azure Virtual Network TAP) Often, much of this traffic will be in cleartext due to the use of TLS termination at the load balancer level to reduce the strain of encrypting and decrypting traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)(Citation: SpecterOps AWS Traffic Mirroring) The adversary can then use exfiltration techniques such as Transfer Data to Cloud Account in order to access the sniffed traffic.(Citation: Rhino Security Labs AWS VPC Traffic Mirroring)\n\nOn network devices, adversaries may perform network captures using [Network Device CLI](https://attack.mitre.org/techniques/T1059/008) commands such as `monitor capture`.(Citation: US-CERT-TA18-106A)(Citation: capture_embedded_packet_on_software)", "technique_name": "Network Sniffing", "tactics": "Discovery", "detection": "Detecting the events leading up to sniffing network traffic may be the best method of detection. From the host level, an adversary would likely need to perform a [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1557) attack against other devices on a wired network in order to capture traffic that was not to or from the current compromised system. This change in the flow of information is detectable at the enclave network level. Monitor for ARP spoofing and gratuitous ARP broadcasts. Detecting compromised network devices is a bit more challenging. Auditing administrator logins, configuration changes, and device images is required to detect malicious changes.\n\nIn cloud-based environments, monitor for the creation of new traffic mirrors or modification of existing traffic mirrors. For network infrastructure devices, collect AAA logging to monitor for the capture of network traffic.", "platforms": "IaaS, Linux, Network, Windows, macOS", "data sources": "Command: Command Execution, Process: Process Creation", "attackVector": "NETWORK", "baseScore": "7.5 | 6.5", "baseSeverity": "HIGH | MEDIUM", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE | REQUIRED", "exposure_tags": "Cleartext, Modbus | Cleartext, FTP"}}, {"id": "t5_2_cap_18", "label": "Sniff Application Code", "type": "capec", "metadata": {"CVE ID": "CVE-2019-6845 | CVE-2019-6846", "capec_Name": "Sniff Application Code", "capec_Mitre_Techniques": "1040 - Network Sniffing", "capec_Abstraction": "Detailed", "capec_Status": "Draft", "capec_Description": "An adversary passively sniffs network communications and captures application code bound for an authorized client. Once obtained, they can use it as-is, or through reverse-engineering glean sensitive information or exploit the trust relationship between the client and server. Such code may belong to a dynamic update to the client, a patch being applied to a client component or any such interaction where the client is authorized to communicate with the server.", "capec_Likelihood_Of_Attack": "Low", "capec_Typical_Severity": "High", "capec_Execution_Flow": "Step 1: Explore - [Set up a sniffer] The adversary sets up a sniffer in the path between the server and the client and watches the traffic. (Techniques: The adversary sets up a sniffer in the path between the server and the client.) || Step 2: Exploit - [Capturing Application Code Bound During Patching]adversary knows that the computer/OS/application can request new applications to install, or it periodically checks for an available update. The adversary loads the sniffer set up during Explore phase, and extracts the application code from subsequent communication. The adversary then proceeds to reverse engineer the captured code. (Techniques: adversary loads the sniffer to capture the application code bound during a dynamic update., The adversary proceeds to reverse engineer the captured code.)", "capec_Prerequisites": "The attacker must have the ability to place themself in the communication path between the client and server. || The targeted application must receive some application code from the server; for example, dynamic updates, patches, applets or scripts. || The attacker must be able to employ a sniffer on the network without being detected.", "capec_Skills_Required": "Medium: The attacker needs to setup a sniffer for a sufficient period of time so as to capture meaningful quantities of code. The presence of the sniffer should not be detected on the network. Also if the attacker plans to employ an adversary-in-the-middle attack (CAPEC-94), the client or server must not realize this. Finally, the attacker needs to regenerate source code from binary code if the need be.", "capec_Consequences": "Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges", "capec_Mitigations": "Design: Encrypt all communication between the client and server. || Implementation: Use SSL, SSH, SCP. || Operation: Use \"ifconfig/ipconfig\" or other tools to detect the sniffer installed in the network.", "capec_Related_Weaknesses": "CWE-319, CWE-311, CWE-318, CWE-693", "attackVector": "NETWORK", "exposure_tags": "Cleartext, Modbus | Cleartext, FTP"}}, {"id": "t5_2_and_18", "label": "AND", "type": "gate"}, {"id": "t5_tac_or", "label": "OR", "type": "gate"}];
var nodeInfo = {};
NODES_DATA.forEach(function(n) { nodeInfo[n.id] = n; });
var panelCol  = document.getElementById('panel-col');
var panelBody = document.getElementById('panel-body');
var panelTitle= document.getElementById('panel-title');
var closeBtn  = document.getElementById('close-btn');
var svgScroll = document.getElementById('svg-scroll');
var selectedGroup = null;
function showPanel(nodeId) {
  var info = nodeInfo[nodeId] || {};
  var label = info.label || nodeId;
  var ntype = info.type || 'unknown';
  var htmlTbl = NODE_HTML[nodeId] || '<div class="meta-empty">No metadata recorded for this node.</div>';
  panelTitle.textContent = 'Node metadata';
  var badgeClass = 'badge-' + ntype;
  panelBody.innerHTML = '<p class="node-label-heading">' + escHtml(label) + '</p>' +
    '<span class="node-type-badge ' + badgeClass + '">' + escHtml(ntype) + '</span>' + htmlTbl;
  panelCol.classList.remove('hidden');
}
function closePanel() {
  panelCol.classList.add('hidden');
  if (selectedGroup) { selectedGroup.classList.remove('selected-node'); selectedGroup = null; }
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
document.addEventListener('DOMContentLoaded', function() {
  var groups = svgScroll.querySelectorAll('[data-node-id]');
  groups.forEach(function(g) {
    g.addEventListener('click', function(ev) {
      ev.stopPropagation();
      var nodeId = g.getAttribute('data-node-id');
      if (selectedGroup && selectedGroup !== g) { selectedGroup.classList.remove('selected-node'); }
      if (selectedGroup === g) { closePanel(); return; }
      selectedGroup = g; g.classList.add('selected-node'); showPanel(nodeId);
    });
  });
  svgScroll.addEventListener('click', function() { closePanel(); });
  closeBtn.addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePanel(); });
});
</script>
</body>
</html>
