2</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-290: Authentication Bypass by Spoofing vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause an elevation of privilege by conducting a brute force attack on Modbus parameters sent to the controller.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to position themselves between two or more networked devices using an adversary-in-the-middle (AiTM) technique to support follow-on behaviors such as [Network Sniffing](https://attack.mitre.org/techniques/T1040), [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1565/002), or replay attacks ([Exploitation for Credential Access](https://attack.mitre.org/techniques/T1212)). By abusing features of common networking protocols that can determine the flow of network traffic (e.g. ARP, DNS, LLMNR, etc.), adversaries may force a device to communicate through an adversary controlled system so they can collect information or perform additional actions.(Citation: Rapid7 MiTM Basics)\n\nFor example, adversaries may manipulate victim DNS settings to enable other malicious activities such as preventing/redirecting users from accessing legitimate sites and/or pushing additional malware.(Citation: ttint_rat)(Citation: dns_changer_trojans)(Citation: ad_blocker_with_miner) Adversaries may also manipulate DNS and leverage their position in order to intercept user credentials, including access tokens ([Steal Application Access Token](https://attack.mitre.org/techniques/T1528)) and session cookies ([Steal Web Session Cookie](https://attack.mitre.org/techniques/T1539)).(Citation: volexity_0day_sophos_FW)(Citation: Token tactics) [Downgrade Attack](https://attack.mitre.org/techniques/T1562/010)s can also be used to establish an AiTM position, such as by negotiating a less secure, deprecated, or weaker version of communication protocol (SSL/TLS) or encryption algorithm.(Citation: mitm_tls_downgrade_att)(Citation: taxonomy_downgrade_att_tls)(Citation: tlseminar_downgrade_att)\n\nAdversaries may also leverage the AiTM position to attempt to monitor and/or modify traffic, such as in [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1565/002). Adversaries can setup a position similar to AiTM to prevent traffic from flowing to the appropriate destination, potentially to [Impair Defenses](https://attack.mitre.org/techniques/T1562) and/or in support of a [Network Denial of Service](https://attack.mitre.org/techniques/T1498).</td></tr><tr><th>tactics</th><td>Collection</td></tr><tr><th>detection</th><td>Monitor network traffic for anomalies associated with known AiTM behavior. Consider monitoring for modifications to system configuration files involved in shaping network traffic flow.</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Application Log: Application Log Content, Network Traffic: Network Traffic Content, Network Traffic: Network Traffic Flow, Service: Service Creation, Windows Registry: Windows Registry Key Modification</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t7_0_cap_0": "<table class='meta-table'><tr><th>capec_Name</th><td>Adversary in the Middle (AiTM)</td></tr><tr><th>CVE ID</th><td>CVE-2018-7842</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1557 - Adversary-in-the-Middle</td></tr><tr><th>capec_Abstraction</th><td>Meta</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>An adversary targets the communication between two components (typically client and server), in order to alter or obtain data from transactions. A general approach entails the adversary placing themself within the communication channel between the two components.</td></tr><tr><th>capec_Extended_Description</th><td>Whenever one component attempts to communicate with the other (data flow, authentication challenges, etc.), the data first flows through the adversary, who has the opportunity to observe or alter it, before being passed on to the intended recipient as if it was never observed. This interposition is transparent leaving the two compromised components unaware of the potential corruption or leakage of their communications. The potential for these attacks yields an implicit lack of trust in communication or identify between two components. \n             These attacks differ from Sniffing Attacks (CAPEC-157) since these attacks often modify the communications prior to delivering it to the intended recipient.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Very High</td></tr><tr><th>capec_Execution_Flow</th><td>Step 1: Explore - [Determine Communication Mechanism] The adversary determines the nature and mechanism of communication between two components, looking for opportunities to exploit. (Techniques: Perform a sniffing attack and observe communication to determine a communication protocol., Look for application documentation that might describe a communication mechanism used by a target.) || Step 2: Experiment - [Position In Between Targets] The adversary inserts themself into the communication channel initially acting as a routing proxy between the two targeted components. (Techniques: Install spyware on a client that will intercept outgoing packets and route them to their destination as well as route incoming packets back to the client., Exploit a weakness in an encrypted communication mechanism to gain access to traffic. Look for outdated mechanisms such as SSL.) || Step 3: Exploit - [Use Intercepted Data Maliciously] The adversary observes, filters, or alters passed data of its choosing to gain access to sensitive information or to manipulate the actions of the two target components for their own purposes. (Techniques: Prevent some messages from reaching their destination, causing a denial of service.)</td></tr><tr><th>capec_Prerequisites</th><td>There are two components communicating with each other. || An attacker is able to identify the nature and mechanism of communication between the two target components. || An attacker can eavesdrop on the communication between the target components. || Strong mutual authentication is not used between the two target components yielding opportunity for attacker interposition. || The communication occurs in clear (not encrypted) or with insufficient and spoofable encryption.</td></tr><tr><th>capec_Skills_Required</th><td>Medium: This attack can get sophisticated since the attack may use cryptography.</td></tr><tr><th>capec_Consequences</th><td>Scope: Integrity | Impact: Modify Data || Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges || Scope: Confidentiality | Impact: Read Data</td></tr><tr><th>capec_Mitigations</th><td>Ensure Public Keys are signed by a Certificate Authority || Encrypt communications using cryptography (e.g., SSL/TLS) || Use Strong mutual authentication to always fully authenticate both ends of any communications channel. || Exchange public keys using a secure channel</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-300, CWE-290, CWE-593, CWE-287, CWE-294</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t7_cwe_1": "<table class='meta-table'><tr><th>cwe_Name</th><td>Improper Authentication</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.</td></tr><tr><th>cwe_Abstraction</th><td>Class</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Draft</td></tr><tr><th>cwe_Description</th><td>When an actor claims to have a given identity, the product does not prove or insufficiently proves that the claim is correct.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-284 (ChildOf, View: 1000, Ordinal: Primary); CWE-284 (ChildOf, View: 1340, Ordinal: Primary)</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Architecture and Design: N/A | Implementation: REALIZATION: This weakness is caused during implementation of an architectural security tactic.</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Integrity, Confidentiality, Availability, Access Control | Impact: Read Application Data, Gain Privileges or Assume Identity, Execute Unauthorized Code or Commands | Note: This weakness can lead to the exposure of resources or functionality to unintended actors, possibly providing attackers with sensitive information or even execute arbitrary code.</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Automated Static Analysis | Effectiveness: Limited | Description:  || Method: Manual Static Analysis | Effectiveness: High | Description:  || Method: Manual Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis | Effectiveness: SOAR Partial | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Architecture and Design | Description: N/A</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>HIGH</td></tr><tr><th>exploitabilityScore</th><td>3.9</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t7_1_tech_1": "<table class='meta-table'><tr><th>technique_name</th><td>Browser Session Hijacking</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.</td></tr><tr><th>tech_description</th><td>Adversaries may take advantage of security vulnerabilities and inherent functionality in browser software to change content, modify user-behaviors, and intercept information as part of various browser session hijacking techniques.(Citation: Wikipedia Man in the Browser)\n\nA specific example is when an adversary injects software into a browser that allows them to inherit cookies, HTTP sessions, and SSL client certificates of a user then use the browser as a way to pivot into an authenticated intranet.(Citation: Cobalt Strike Browser Pivot)(Citation: ICEBRG Chrome Extensions) Executing browser-based behaviors such as pivoting may require specific process permissions, such as &lt;code&gt;SeDebugPrivilege&lt;/code&gt; and/or high-integrity/administrator rights.\n\nAnother example involves pivoting browser traffic from the adversary&#x27;s browser through the user&#x27;s browser by setting up a proxy which will redirect web traffic. This does not alter the user&#x27;s traffic in any way, and the proxy connection can be severed as soon as the browser is closed. The adversary assumes the security context of whichever browser process the proxy is injected into. Browsers typically create a new process for each tab that is opened and permissions and certificates are separated accordingly. With these permissions, an adversary could potentially browse to any resource on an intranet, such as [Sharepoint](https://attack.mitre.org/techniques/T1213/002) or webmail, that is accessible through the browser and which the browser has sufficient permissions. Browser pivoting may also bypass security provided by 2-factor authentication.(Citation: cobaltstrike manual)</td></tr><tr><th>tactics</th><td>Collection</td></tr><tr><th>detection</th><td>This may be a difficult technique to detect because adversary traffic may be masked by normal user traffic. New processes may not be created and no additional software dropped to disk. Authentication logs can be used to audit logins to specific web applications, but determining malicious logins versus benign logins may be difficult if activity matches typical user behavior. Monitor for [Process Injection](https://attack.mitre.org/techniques/T1055) against browser applications.</td></tr><tr><th>platforms</th><td>Windows</td></tr><tr><th>data sources</th><td>Logon Session: Logon Session Creation, Process: Process Access, Process: Process Modification</td></tr><tr><th>permissions required</th><td>Administrator, SYSTEM</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t7_1_cap_1": "<table class='meta-table'><tr><th>capec_Name</th><td>Session Hijacking</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1185 - Browser Session Hijacking</td></tr><tr><th>capec_Abstraction</th><td>Standard</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>This type of attack involves an adversary that exploits weaknesses in an application&#x27;s use of sessions in performing authentication. The adversary is able to steal or manipulate an active session and use it to gain unathorized access to the application.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Very High</td></tr><tr><th>capec_Execution_Flow</th><td>Step 1: Explore - [Discover Existing Session Token] Through varrying means, an adversary will discover and store an existing session token for some other authenticated user session. (Techniques: N/A) || Step 2: Experiment - [Insert Found Session Token] The attacker attempts to insert a found session token into communication with the targeted application to confirm viability for exploitation. (Techniques: N/A) || Step 3: Exploit - [Session Token Exploitation] The attacker leverages the captured session token to interact with the targeted application in a malicious fashion, impersonating the victim. (Techniques: N/A)</td></tr><tr><th>capec_Prerequisites</th><td>An application that leverages sessions to perform authentication.</td></tr><tr><th>capec_Skills_Required</th><td>Low: Exploiting a poorly protected identity token is a well understood attack with many helpful resources available.</td></tr><tr><th>capec_Resources_Required</th><td>The adversary must have the ability to communicate with the application over the network.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality, Integrity, Availability | Impact: Gain Privileges</td></tr><tr><th>capec_Mitigations</th><td>Properly encrypt and sign identity tokens in transit, and use industry standard session key generation mechanisms that utilize high amount of entropy to generate the session key. Many standard web and application servers will perform this task on your behalf. Utilize a session timeout for all sessions. If the user does not explicitly logout, terminate their session after this period of inactivity. If the user logs back in then a new session key should be generated.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-287</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t7_1_tech_2": "<table class='meta-table'><tr><th>technique_name</th><td>Adversary-in-the-Middle</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.</td></tr><tr><th>tech_description</th><td>Adversaries may attempt to position themselves between two or more networked devices using an adversary-in-the-middle (AiTM) technique to support follow-on behaviors such as [Network Sniffing](https://attack.mitre.org/techniques/T1040), [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1565/002), or replay attacks ([Exploitation for Credential Access](https://attack.mitre.org/techniques/T1212)). By abusing features of common networking protocols that can determine the flow of network traffic (e.g. ARP, DNS, LLMNR, etc.), adversaries may force a device to communicate through an adversary controlled system so they can collect information or perform additional actions.(Citation: Rapid7 MiTM Basics)\n\nFor example, adversaries may manipulate victim DNS settings to enable other malicious a Use Strong mutual authentication to always fully authenticate both ends of any communications channel. || Exchange public keys using a secure channel</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-300, CWE-290, CWE-593, CWE-287, CWE-294</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t7_cwe_2": "<table class='meta-table'><tr><th>cwe_Name</th><td>Cleartext Transmission of Sensitive Information</td></tr><tr><th>CVE ID</th><td>CVE-2019-6845 | CVE-2019-6846</td></tr><tr><th>baseScore</th><td>7.5 | 6.5</td></tr><tr><th>baseSeverity</th><td>HIGH | MEDIUM</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information when transferring applications to the controller using Modbus TCP protocol. | A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon BMxCRA and 140CRA modules (all firmware versions), which could cause information disclosure when using the FTP protocol.</td></tr><tr><th>cwe_Abstraction</th><td>Base</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Draft</td></tr><tr><th>cwe_Description</th><td>The product transmits sensitive or security-critical data in cleartext in a communication channel that can be sniffed by unauthorized actors.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-311 (ChildOf, View: 1000, Ordinal: Primary); CWE-311 (ChildOf, View: 1003, Ordinal: Primary)</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Architecture and Design: OMISSION: This weakness is caused by missing a security tactic during the architecture and design phase. | Architecture and Design: For hardware, this may be introduced when design does not plan for an attacker having physical access while a legitimate user is remotely operating the device. | Operation: N/A | System Configuration: N/A</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Integrity, Confidentiality | Impact: Read Application Data, Modify Files or Directories | Note: Anyone can read the information by gaining access to the channel being used for communication.</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Black Box | Effectiveness: N/A | Description:  || Method: Automated Static Analysis | Effectiveness: High | Description: Automated static analysis, commonly referred to as Static Application Security Testing (SAST), can find some instances of this weakness by analyzing source code (or binary/compiled code) without having to execute it. Typically, this is done by building a model of data flow and control flow, then searching for potentially-vulnerable patterns that connect &quot;sources&quot; (origins of input) with &quot;sinks&quot; (destinations where the data interacts with external components, a lower layer such as the OS, etc.)</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Architecture and Design | Description: N/A || Phase: Implementation | Description: N/A || Phase: Implementation | Description: N/A || Phase: Testing | Description: N/A || Phase: Operation | Description: N/A</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE | REQUIRED</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>NONE</td></tr><tr><th>exploitabilityScore</th><td>3.9 | 2.8</td></tr><tr><th>exposure_tags</th><td>Cleartext, Modbus | Cleartext, FTP</td></tr></table>", "t7_2_sub_3": "<table class='meta-table'><tr><th>technique_name</th><td>Input Capture</td></tr><tr><th>subtechnique_name</th><td>Input Capture: Credential API Hooking</td></tr><tr><th>tactics</th><td>Collection</td></tr><tr><th>detection</th><td>Monitor for calls to the `SetWindowsHookEx` and `SetWinEventHook` functions, which install a hook procedure.(Citation: Microsoft Hook Overview)(Citation: Volatility Detecting Hooks Sept 2012) Also consider analyzing hook chains (which hold pointers to hook procedures for each type of hook) using tools(Citation: Volatility Detecting Hooks Sept 2012)(Citation: PreKageo Winhook Jul 2011)(Citation: Jay GetHooks Sept 2011) or by programmatically examining internal kernel structures.(Citation: Zairon Hooking Dec 2006)(Citation: EyeofRa Detecting Hooking June 2017)\n\nRootkits detectors(Citation: GMER Rootkits) can also be used to monitor for various types of hooking activity.\n\nVerify integrity of live processes by comparing code in memory to that of corresponding static binaries, specifically checking for jumps and other instructions that redirect code flow. Also consider taking snapshots of newly started processes(Citation: Microsoft Process Snapshot) to compare the in-memory IAT to the real addresses of the referenced functions.(Citation: StackExchange Hooks Jul 2012)(Citation: Adlice Software IAT Hooks Oct 2014)</td></tr><tr><th>platforms</th><td>Windows</td></tr><tr><th>data sources</th><td>Process: OS API Execution, Process: Process Metadata</td></tr></table>", "t7_2_cap_3": "<table class='meta-table'><tr><th>capec_Name</th><td>Harvesting Information via API Event Monitoring</td></tr><tr><th>CVE ID</th><td>CVE-2019-6845 | CVE-2019-6846</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1056.004 - Input Capture</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>An adversary hosts an event within an application framework and then monitors the data exchanged during the course of the event for the purpose of harvesting any important data leaked during the transactions. One example could be harvesting lists of usernames or userIDs for the purpose of sending spam messages to those users. One example of this type of attack involves the adversary creating an event within the sub-application. Assume the adversary hosts a &quot;virtual sale&quot; of rare items. As other users enter the event, the attacker records via AiTM (CAPEC-94) proxy the user_ids and usernames of everyone who attends. The adversary would then be able to spam those users within the application using an automated script.</td></tr><tr><th>capec_Typical_Severity</th><td>Low</td></tr><tr><th>capec_Prerequisites</th><td>The target software is utilizing application framework APIs</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data</td></tr><tr><th>capec_Mitigations</th><td>Leverage encryption techniques during information transactions so as to protect them from attack patterns of this kind.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-311, CWE-319, CWE-419, CWE-602</td></tr><tr><th>exposure_tags</th><td>Cleartext, Modbus | Cleartext, FTP</td></tr></table>"};
var NODES_DATA = [{"id": "t7_tactic", "label": "Collection", "type": "tactic", "metadata": {"tactic": "Collection"}}, {"id": "t7_cwe_0", "label": "Authentication Bypass by Spoofing", "type": "cwe", "metadata": {"CVE ID": "CVE-2018-7842", "Description": "A CWE-290: Authentication Bypass by Spoofing vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause an elevation of privilege by conducting a brute force attack on Modbus parameters sent to the controller.", "cwe_Name": "Authentication Bypass by Spoofing", "cwe_Abstraction": "Base", "cwe_Structure": "Simple", "cwe_Status": "Incomplete", "cwe_Description": "This attack-focused weakness is caused by incorrectly implemented authentication schemes that are subject to spoofing attacks.", "cwe_Related_Weaknesses": "CWE-1390 (ChildOf, View: 1000, Ordinal: Primary); CWE-287 (ChildOf, View: 1003, Ordinal: Primary)", "cwe_Modes_Of_Introduction": "Implementation: N/A", "cwe_Common_Consequences": "Scope: Access Control | Impact: Bypass Protection Mechanism, Gain Privileges or Assume Identity | Note: This weakness can allow an attacker to access resources which are not otherwise accessible without proper authentication.", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "confidentialityImpact": "HIGH", "availabilityImpact": "HIGH", "exploitabilityScore": "3.9", "exposure_tags": "Modbus"}}, {"id": "t7_0_tech_0", "label": "Adversary-in-the-Middle", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7842", "Description": "A CWE-290: Authentication Bypass by Spoofing vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause an elevation of privilege by conducting a brute force attack on Modbus parameters sent to the controller.", "tech_description": "Adversaries may attempt to position themselves between two or more networked devices using an adversary-in-the-middle (AiTM) technique to support follow-on behaviors such as [Network Sniffing](https://attack.mitre.org/techniques/T1040), [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1565/002), or replay attacks ([Exploitation for Credential Access](https://attack.mitre.org/techniques/T1212)). By abusing features of common networking protocols that can determine the flow of network traffic (e.g. ARP, DNS, LLMNR, etc.), adversaries may force a device to communicate through an adversary controlled system so they can collect information or perform additional actions.(Citation: Rapid7 MiTM Basics)\n\nFor example, adversaries may manipulate victim DNS settings to enable other malicious activities such as preventing/redirecting users from accessing legitimate sites and/or pushing additional malware.(Citation: ttint_rat)(Citation: dns_changer_trojans)(Citation: ad_blocker_with_miner) Adversaries may also manipulate DNS and leverage their position in order to intercept user credentials, including access tokens ([Steal Application Access Token](https://attack.mitre.org/techniques/T1528)) and session cookies ([Steal Web Session Cookie](https://attack.mitre.org/techniques/T1539)).(Citation: volexity_0day_sophos_FW)(Citation: Token tactics) [Downgrade Attack](https://attack.mitre.org/techniques/T1562/010)s can also be used to establish an AiTM position, such as by negotiating a less secure, deprecated, or weaker version of communication protocol (SSL/TLS) or encryption algorithm.(Citation: mitm_tls_downgrade_att)(Citation: taxonomy_downgrade_att_tls)(Citation: tlseminar_downgrade_att)\n\nAdversaries may also leverage the AiTM position to attempt to monitor and/or modify traffic, such as in [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1565/002). Adversaries can setup a position similar to AiTM to prevent traffic from flowing to the appropriate destination, potentially to [Impair Defenses](https://attack.mitre.org/techniques/T1562) and/or in support of a [Network Denial of Service](https://attack.mitre.org/techniques/T1498).", "technique_name": "Adversary-in-the-Middle", "tactics": "Collection", "detection": "Monitor network traffic for anomalies associated with known AiTM behavior. Consider monitoring for modifications to system configuration files involved in shaping network traffic flow.", "platforms": "Linux, Network, Windows, macOS", "data sources": "Application Log: Application Log Content, Network Traffic: Network Traffic Content, Network Traffic: Network Traffic Flow, Service: Service Creation, Windows Registry: Windows Registry Key Modification", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus"}}, {"id": "t7_0_cap_0", "label": "Adversary in the Middle (AiTM)", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7842", "capec_Name": "Adversary in the Middle (AiTM)", "capec_Mitre_Techniques": "1557 - Adversary-in-the-Middle", "capec_Abstraction": "Meta", "capec_Status": "Stable", "capec_Description": "An adversary targets the communication between two components (typically client and server), in order to alter or obtain data from transactions. A general approach entails the adversary placing themself within the communication channel between the two components.", "capec_Extended_Description": "Whenever one component attempts to communicate with the other (data flow, authentication challenges, etc.), the data first flows through the adversary, who has the opportunity to observe or alter it, before being passed on to the intended recipient as if it was never observed. This interposition is transparent leaving the two compromised components unaware of the potential corruption or leakage of their communications. The potential for these attacks yields an implicit lack of trust in communication or identify between two components. \n             These attacks differ from Sniffing Attacks (CAPEC-157) since these attacks often modify the communications prior to delivering it to the intended recipient.", "capec_Likelihood_Of_Attack": "High", "capec_Typical_Severity": "Very High", "capec_Execution_Flow": "Step 1: Explore - [Determine Communication Mechanism] The adversary determines the nature and mechanism of communication between two components, looking for opportunities to exploit. (Techniques: Perform a sniffing attack and observe communication to determine a communication protocol., Look for application documentation that might describe a communication mechanism used by a target.) || Step 2: Experiment - [Position In Between Targets] The adversary inserts themself into the communication channel initially acting as a routing proxy between the two targeted components. (Techniques: Install spyware on a client that will intercept outgoing packets and route them to their destination as well as route incoming packets back to the client., Exploit a weakness in an encrypted communication mechanism to gain access to traffic. Look for outdated mechanisms such as SSL.) || Step 3: Exploit - [Use Intercepted Data Maliciously] The adversary observes, filters, or alters passed data of its choosing to gain access to sensitive information or to manipulate the actions of the two target components for their own purposes. (Techniques: Prevent some messages from reaching their destination, causing a denial of service.)", "capec_Prerequisites": "There are two components communicating with each other. || An attacker is able to identify the nature and mechanism of communication between the two target components. || An attacker can eavesdrop on the communication between the target components. || Strong mutual authentication is not used between the two target components yielding opportunity for attacker interposition. || The communication occurs in clear (not encrypted) or with insufficient and spoofable encryption.", "capec_Skills_Required": "Medium: This attack can get sophisticated since the attack may use cryptography.", "capec_Consequences": "Scope: Integrity | Impact: Modify Data || Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges || Scope: Confidentiality | Impact: Read Data", "capec_Mitigations": "Ensure Public Keys are signed by a Certificate Authority || Encrypt communications using cryptography (e.g., SSL/TLS) || Use Strong mutual authentication to always fully authenticate both ends of any communications channel. || Exchange public keys using a secure channel", "capec_Related_Weaknesses": "CWE-300, CWE-290, CWE-593, CWE-287, CWE-294", "attackVector": "NETWORK", "exposure_tags": "Modbus"}}, {"id": "t7_0_and_0", "label": "AND", "type": "gate"}, {"id": "t7_cwe_1", "label": "Improper Authentication", "type": "cwe", "metadata": {"CVE ID": "CVE-2018-7847", "Description": "A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.", "cwe_Name": "Improper Authentication", "cwe_Abstraction": "Class", "cwe_Structure": "Simple", "cwe_Status": "Draft", "cwe_Description": "When an actor claims to have a given identity, the product does not prove or insufficiently proves that the claim is correct.", "cwe_Related_Weaknesses": "CWE-284 (ChildOf, View: 1000, Ordinal: Primary); CWE-284 (ChildOf, View: 1340, Ordinal: Primary)", "cwe_Modes_Of_Introduction": "Architecture and Design: N/A | Implementation: REALIZATION: This weakness is caused during implementation of an architectural security tactic.", "cwe_Likelihood_Of_Exploit": "High", "cwe_Common_Consequences": "Scope: Integrity, Confidentiality, Availability, Access Control | Impact: Read Application Data, Gain Privileges or Assume Identity, Execute Unauthorized Code or Commands | Note: This weakness can lead to the exposure of resources or functionality to unintended actors, possibly providing attackers with sensitive information or even execute arbitrary code.", "cwe_Detection_Methods": "Method: Automated Static Analysis | Effectiveness: Limited | Description:  || Method: Manual Static Analysis | Effectiveness: High | Description:  || Method: Manual Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis | Effectiveness: SOAR Partial | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:", "cwe_Potential_Mitigations": "Phase: Architecture and Design | Description: N/A", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "confidentialityImpact": "HIGH", "availabilityImpact": "HIGH", "exploitabilityScore": "3.9", "exposure_tags": "Modbus"}}, {"id": "t7_1_tech_1", "label": "Browser Session Hijacking", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7847", "Description": "A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.", "tech_description": "Adversaries may take advantage of security vulnerabilities and inherent functionality in browser software to change content, modify user-behaviors, and intercept information as part of various browser session hijacking techniques.(Citation: Wikipedia Man in the Browser)\n\nA specific example is when an adversary injects software into a browser that allows them to inherit cookies, HTTP sessions, and SSL client certificates of a user then use the browser as a way to pivot into an authenticated intranet.(Citation: Cobalt Strike Browser Pivot)(Citation: ICEBRG Chrome Extensions) Executing browser-based behaviors such as pivoting may require specific process permissions, such as <code>SeDebugPrivilege</code> and/or high-integrity/administrator rights.\n\nAnother example involves pivoting browser traffic from the adversary's browser through the user's browser by setting up a proxy which will redirect web traffic. This does not alter the user's traffic in any way, and the proxy connection can be severed as soon as the browser is closed. The adversary assumes the security context of whichever browser process the proxy is injected into. Browsers typically create a new process for each tab that is opened and permissions and certificates are separated accordingly. With these permissions, an adversary could potentially browse to any resource on an intranet, such as [Sharepoint](https://attack.mitre.org/techniques/T1213/002) or webmail, that is accessible through the browser and which the browser has sufficient permissions. Browser pivoting may also bypass security provided by 2-factor authentication.(Citation: cobaltstrike manual)", "technique_name": "Browser Session Hijacking", "tactics": "Collection", "detection": "This may be a difficult technique to detect because adversary traffic may be masked by normal user traffic. New processes may not be created and no additional software dropped to disk. Authentication logs can be used to audit logins to specific web applications, but determining malicious logins versus benign logins may be difficult if activity matches typical user behavior. Monitor for [Process Injection](https://attack.mitre.org/techniques/T1055) against browser applications.", "platforms": "Windows", "data sources": "Logon Session: Logon Session Creation, Process: Process Access, Process: Process Modification", "permissions required": "Administrator, SYSTEM", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "exposure_tags": "Modbus"}}, {"id": "t7_1_cap_1", "label": "Session Hijacking", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7847", "capec_Name": "Session Hijacking", "capec_Mitre_Techniques": "1185 - Browser Session Hijacking", "capec_Abstraction": "Standard", "capec_Status": "Stable", "capec_Description": "This type of attack involves an adversary that exploits weaknesses in an application's use of sessions in performing authentication. The adversary is able to steal or manipulate an active session and use it to gain unathorized access to the application.", "capec_Likelihood_Of_Attack": "High", "capec_Typical_Severity": "Very High", "capec_Execution_Flow": "Step 1: Explore - [Discover Existing Session Token] Through varrying means, an adversary will discover and store an existing session token for some other authenticated user session. (Techniques: N/A) || Step 2: Experiment - [Insert Found Session Token] The attacker attempts to insert a found session token into communication with the targeted application to confirm viability for exploitation. (Techniques: N/A) || Step 3: Exploit - [Session Token Exploitation] The attacker leverages the captured session token to interact with the targeted application in a malicious fashion, impersonating the victim. (Techniques: N/A)", "capec_Prerequisites": "An application that leverages sessions to perform authentication.", "capec_Skills_Required": "Low: Exploiting a poorly protected identity token is a well understood attack with many helpful resources available.", "capec_Resources_Required": "The adversary must have the ability to communicate with the application over the network.", "capec_Consequences": "Scope: Confidentiality, Integrity, Availability | Impact: Gain Privileges", "capec_Mitigations": "Properly encrypt and sign identity tokens in transit, and use industry standard session key generation mechanisms that utilize high amount of entropy to generate the session key. Many standard web and application servers will perform this task on your behalf. Utilize a session timeout for all sessions. If the user does not explicitly logout, terminate their session after this period of inactivity. If the user logs back in then a new session key should be generated.", "capec_Related_Weaknesses": "CWE-287", "attackVector": "NETWORK", "exposure_tags": "Modbus"}}, {"id": "t7_1_and_1", "label": "AND", "type": "gate"}, {"id": "t7_1_tech_2", "label": "Adversary-in-the-Middle", "type": "tech", "metadata": {"CVE ID": "CVE-2018-7847", "Description": "A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.", "tech_description": "Adversaries may attempt to position themselves between two or more networked devices using an adversary-in-the-middle (AiTM) technique to support follow-on behaviors such as [Network Sniffing](https://attack.mitre.org/techniques/T1040), [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1565/002), or replay attacks ([Exploitation for Credential Access](https://attack.mitre.org/techniques/T1212)). By abusing features of common networking protocols that can determine the flow of network traffic (e.g. ARP, DNS, LLMNR, etc.), adversaries may force a device to communicate through an adversary controlled system so they can collect information or perform additional actions.(Citation: Rapid7 MiTM Basics)\n\nFor example, adversaries may  "NETWORK", "exposure_tags": "Modbus"}}, {"id": "t7_1_and_2", "label": "AND", "type": "gate"}, {"id": "t7_cwe1_or", "label": "OR", "type": "gate"}, {"id": "t7_cwe_2", "label": "Cleartext Transmission of Sensitive Information", "type": "cwe", "metadata": {"CVE ID": "CVE-2019-6845 | CVE-2019-6846", "Description": "A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information when transferring applications to the controller using Modbus TCP protocol. | A CWE-319: Cleartext Transmission of Sensitive Information vulnerability exists in Modicon M580, Modicon M340, Modicon BMxCRA and 140CRA modules (all firmware versions), which could cause information disclosure when using the FTP protocol.", "cwe_Name": "Cleartext Transmission of Sensitive Information", "cwe_Abstraction": "Base", "cwe_Structure": "Simple", "cwe_Status": "Draft", "cwe_Description": "The product transmits sensitive or security-critical data in cleartext in a communication channel that can be sniffed by unauthorized actors.", "cwe_Related_Weaknesses": "CWE-311 (ChildOf, View: 1000, Ordinal: Primary); CWE-311 (ChildOf, View: 1003, Ordinal: Primary)", "cwe_Modes_Of_Introduction": "Architecture and Design: OMISSION: This weakness is caused by missing a security tactic during the architecture and design phase. | Architecture and Design: For hardware, this may be introduced when design does not plan for an attacker having physical access while a legitimate user is remotely operating the device. | Operation: N/A | System Configuration: N/A", "cwe_Likelihood_Of_Exploit": "High", "cwe_Common_Consequences": "Scope: Integrity, Confidentiality | Impact: Read Application Data, Modify Files or Directories | Note: Anyone can read the information by gaining access to the channel being used for communication.", "cwe_Detection_Methods": "Method: Black Box | Effectiveness: N/A | Description:  || Method: Automated Static Analysis | Effectiveness: High | Description: Automated static analysis, commonly referred to as Static Application Security Testing (SAST), can find some instances of this weakness by analyzing source code (or binary/compiled code) without having to execute it. Typically, this is done by building a model of data flow and control flow, then searching for potentially-vulnerable patterns that connect \"sources\" (origins of input) with \"sinks\" (destinations where the data interacts with external components, a lower layer such as the OS, etc.)", "cwe_Potential_Mitigations": "Phase: Architecture and Design | Description: N/A || Phase: Implementation | Description: N/A || Phase: Implementation | Description: N/A || Phase: Testing | Description: N/A || Phase: Operation | Description: N/A", "attackVector": "NETWORK", "baseScore": "7.5 | 6.5", "baseSeverity": "HIGH | MEDIUM", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE | REQUIRED", "confidentialityImpact": "HIGH", "availabilityImpact": "NONE", "exploitabilityScore": "3.9 | 2.8", "exposure_tags": "Cleartext, Modbus | Cleartext, FTP"}}, {"id": "t7_2_sub_3", "label": "Input Capture: Credential API Hooking", "type": "subtech", "metadata": {"subtechnique_name": "Input Capture: Credential API Hooking", "technique_name": "Input Capture", "tactics": "Collection", "detection": "Monitor for calls to the `SetWindowsHookEx` and `SetWinEventHook` functions, which install a hook procedure.(Citation: Microsoft Hook Overview)(Citation: Volatility Detecting Hooks Sept 2012) Also consider analyzing hook chains (which hold pointers to hook procedures for each type of hook) using tools(Citation: Volatility Detecting Hooks Sept 2012)(Citation: PreKageo Winhook Jul 2011)(Citation: Jay GetHooks Sept 2011) or by programmatically examining internal kernel structures.(Citation: Zairon Hooking Dec 2006)(Citation: EyeofRa Detecting Hooking June 2017)\n\nRootkits tions so as to protect them from attack patterns of this kind.", "capec_Related_Weaknesses": "CWE-311, CWE-319, CWE-419, CWE-602", "attackVector": "NETWORK", "exposure_tags": "Cleartext, Modbus | Cleartext, FTP"}}, {"id": "t7_2_and_3", "label": "AND", "type": "gate"}, {"id": "t7_tac_or", "label": "OR", "type": "gate"}];
var nodeInfo = {};
NODES_DATA.forEach(function(n) { nodeInfo[n.id] = n; });
var panelCol  = document.getElementById('panel-col');
var panelBody = document.getElementById('panel-body');
var panelTitle= document.getElementById('panel-title');
var closeBtn  = document.getElementById('close-btn');
var svgScroll = document.getElementById('svg-scroll');
var selectedGroup = null;
function showPanel(nodeId) {
  var info = nodeInfo[nodeId] || {};
  var label = info.label || nodeId;
  var ntype = info.type || 'unknown';
  var htmlTbl = NODE_HTML[nodeId] || '<div class="meta-empty">No metadata recorded for this node.</div>';
  panelTitle.textContent = 'Node metadata';
  var badgeClass = 'badge-' + ntype;
  panelBody.innerHTML = '<p class="node-label-heading">' + escHtml(label) + '</p>' +
    '<span class="node-type-badge ' + badgeClass + '">' + escHtml(ntype) + '</span>' + htmlTbl;
  panelCol.classList.remove('hidden');
}
function closePanel() {
  panelCol.classList.add('hidden');
  if (selectedGroup) { selectedGroup.classList.remove('selected-node'); selectedGroup = null; }
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
document.addEventListener('DOMContentLoaded', function() {
  var groups = svgScroll.querySelectorAll('[data-node-id]');
  groups.forEach(function(g) {
    g.addEventListener('click', function(ev) {
      ev.stopPropagation();
      var nodeId = g.getAttribute('data-node-id');
      if (selectedGroup && selectedGroup !== g) { selectedGroup.classList.remove('selected-node'); }
      if (selectedGroup === g) { closePanel(); return; }
      selectedGroup = g; g.classList.add('selected-node'); showPanel(nodeId);
    });
  });
  svgScroll.addEventListener('click', function() { closePanel(); });
  closeBtn.addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePanel(); });
});
</script>
