    .svg-scroll svg { width: auto; height: auto; display: block; cursor: default; }
    .svg-scroll [data-node-id] { cursor: pointer; }
    .svg-scroll [data-node-id]:hover ellipse,
    .svg-scroll [data-node-id]:hover polygon,
    .svg-scroll [data-node-id]:hover path { filter: brightness(0.88); }
    .selected-node ellipse, .selected-node polygon, .selected-node path {
      stroke: #1a6fc4 !important; stroke-width: 3px !important; }
    .graph-footer { padding: 6px 16px; font-size: 13px; color: #666;
                      border-top: 1px solid #e0e0e0; background: #fff; }
    .panel-col { flex: 0 0 400px; display: flex; flex-direction: column;
                   background: #fff; overflow: hidden; transition: flex-basis .2s; }
    .panel-col.hidden { flex: 0 0 0; overflow: hidden; }
    .panel-header { display: flex; align-items: center; justify-content: space-between;
                      padding: 10px 14px; border-bottom: 1px solid #e0e0e0; background: #f8f8f8; }
    .panel-header h2 { margin: 0; font-size: 16px; }
    .close-btn { border: none; background: transparent; font-size: 22px; cursor: pointer;
                   line-height: 1; padding: 0 4px; color: #555; }
    .close-btn:hover { color: #000; }
    .panel-body { flex: 1 1 auto; overflow-y: auto; padding: 14px; }
    .panel-placeholder { color: #888; font-style: italic; margin-top: 20px; text-align: center; }
    .node-label-heading { font-size: 17px; font-weight: 700; margin: 0 0 4px; word-break: break-word; }
    .node-type-badge { display: inline-block; padding: 2px 8px; border-radius: 20px;
                         font-size: 12px; font-weight: 600; margin-bottom: 10px; }
    .meta-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
    .meta-table th { text-align: left; padding: 6px 8px; background: #f3f3f3;
                       border-bottom: 1px solid #e0e0e0; font-weight: 600; width: 36%;
                       vertical-align: top; word-break: break-word; }
    .meta-table td { padding: 6px 8px; border-bottom: 1px solid #eee;
                       vertical-align: top; word-break: break-word; }
    .meta-empty { color: #888; font-style: italic; }
    .badge-root    { background: #FFD700; color: #5a4200; }
    .badge-tactic  { background: #98FB98; color: #1a5c1a; }
    .badge-cwe     { background: #ADD8E6; color: #1a3a5c; }
    .badge-tech    { background: #90EE90; color: #1a5c1a; }

  </style>

<script>
var NODE_HTML  = {"t1_tactic": "<table class='meta-table'><tr><th>tactic</th><td>Persistence</td></tr></table>", "t1_cwe_0": "<table class='meta-table'><tr><th>cwe_Name</th><td>Exposure of Sensitive Information to an Unauthorized Actor</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>baseScore</th><td>7.5</td></tr><tr><th>baseSeverity</th><td>HIGH</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading memory blocks from the controller over Modbus. | A CWE-200: Information Exposure vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause the disclosure of SNMP information when reading files from the controller over Modbus | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when using specific Modbus services provided by the REST API of the controller/communication module. | A CWE-200: Information Exposure vulnerability exists in Modicon M580, Modicon BMENOC 0311, and Modicon BMENOC 0321, which could cause the disclosure of sensitive information when reading specific registers with the REST API of the controller/communication module. | A CWE-538: File and Directory Information Exposure vulnerability exists in Modicon M580, Modicon M340, Modicon Premium , Modicon Quantum (all firmware versions), which could cause the disclosure of information from the controller when using TFTP protocol.</td></tr><tr><th>cwe_Abstraction</th><td>Class</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Draft</td></tr><tr><th>cwe_Description</th><td>The product exposes sensitive information to an actor that is not explicitly authorized to have access to that information.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-668 (ChildOf, View: 1000, Ordinal: Primary)</td></tr><tr><th>cwe_Weakness_Ordinality</th><td>Primary, Resultant</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Architecture and Design: N/A | Implementation: N/A</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Confidentiality | Impact: Read Application Data | Note: N/A</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Automated Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: High | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: High | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: High | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Architecture and Design | Description: Compartmentalize the system to have &quot;safe&quot; areas where trust boundaries can be unambiguously drawn. Do not allow sensitive data to go outside of the trust boundary and always be careful when interfacing with a compartment outside of the safe area. Ensure that appropriate compartmentalization is built into the system design, and the compartmentalization allows for and reinforces privilege separation functionality. Architects and designers should rely on the principle of least privilege to decide the appropriate time to use privileges and the time to drop privileges.</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>NONE</td></tr><tr><th>exploitabilityScore</th><td>3.9</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t1_0_sub_0": "<table class='meta-table'><tr><th>technique_name</th><td>Hijack Execution Flow</td></tr><tr><th>subtechnique_name</th><td>Hijack Execution Flow: Dynamic Linker Hijacking</td></tr><tr><th>tactics</th><td>Persistence</td></tr><tr><th>detection</th><td>Monitor for changes to environment variables and files associated with loading shared libraries such as &lt;code&gt;LD_PRELOAD&lt;/code&gt; and &lt;code&gt;DYLD_INSERT_LIBRARIES&lt;/code&gt;, as well as the commands to implement these changes.\n\nMonitor processes for unusual activity (e.g., a process that does not use the network begins to do so). Track library metadata, such as a hash, and compare libraries that are loaded at process execution time against previous executions to detect differences that do not correlate with patching or updates.</td></tr><tr><th>platforms</th><td>Linux, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, File: File Creation, File: File Modification, Module: Module Load, Process: Process Creation</td></tr></table>", "t1_0_cap_0": "<table class='meta-table'><tr><th>capec_Name</th><td>Subverting Environment Variable Values</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1574.006 - Hijack Execution Flow:Dynamic Linker Hijacking</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>The adversary directly or indirectly modifies environment variables used by or controlling the target software. The adversary&#x27;s goal is to cause the target software to deviate from its expected operation in a manner that benefits the adversary.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Very High</td></tr><tr><th>capec_Execution_Flow</th><td>Step 1: Explore - [Probe target application] The adversary first probes the target application to determine important information about the target. This information could include types software used, software versions, what user input the application consumes, and so on. Most importantly, the adversary tries to determine what environment variables might be used by the underlying software, or even the application itself. (Techniques: N/A) || Step 2: Experiment - [Find user-controlled environment variables] Using the information found by probing the application, the adversary attempts to manipulate any user-controlled environment variables they have found are being used by the application, or suspect are being used by the application, and observe the effects of these changes. If the adversary notices any significant changes to the application, they will know that a certain environment variable is important to the application behavior and indicates a possible attack vector. (Techniques: Alter known environment variables such as &quot;$PATH&quot;, &quot;$HOSTNAME&quot;, or &quot;LD_LIBRARY_PATH&quot; and see if application behavior changes.) || Step 3: Exploit - [Manipulate user-controlled environment variables] The adversary manipulates the found environment variable(s) to abuse the normal flow of processes or to gain access to privileged resources. (Techniques: N/A)</td></tr><tr><th>capec_Prerequisites</th><td>An environment variable is accessible to the user. || An environment variable used by the application can be tainted with user supplied data. || Input data used in an environment variable is not validated properly. || The variables encapsulation is not done properly. For instance setting a variable as public in a class makes it visible and an adversary may attempt to manipulate that variable.</td></tr><tr><th>capec_Skills_Required</th><td>Low: In a web based scenario, the client controls the data that it submitted to the server. So anybody can try to send malicious data and try to bypass the authentication mechanism. || High: Some more advanced attacks may require knowledge about protocols and probing technique which help controlling a variable. The malicious user may try to understand the authentication mechanism in order to defeat it.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality, Integrity, Availability | Impact: Execute Unauthorized Commands || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism || Scope: Availability | Impact: Unreliable Execution || Scope: Confidentiality | Impact: Read Data || Scope: Accountability | Impact: Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Protect environment variables against unauthorized read and write access. || Protect the configuration files which contain environment variables against illegitimate read and write access. || Assume all input is malicious. Create an allowlist that defines all valid input to the software system based on the requirements specifications. Input that does not match against the allowlist should not be permitted to enter into the system. || Apply the least privilege principles. If a process has no legitimate reason to read an environment variable do not give that privilege.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-353, CWE-285, CWE-302, CWE-74, CWE-15, CWE-73, CWE-20, CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t1_0_sub_1": "<table class='meta-table'><tr><th>technique_name</th><td>Hijack Execution Flow</td></tr><tr><th>subtechnique_name</th><td>Hijack Execution Flow: Path Interception by PATH Environment Variable</td></tr><tr><th>tactics</th><td>Persistence</td></tr><tr><th>detection</th><td>Monitor file creation for files named after partial directories and in locations that may be searched for common processes through the environment variable, or otherwise should not be user writable. Monitor the executing process for process executable paths that are named for partial directories. Monitor file creation for programs that are named after Windows system programs or programs commonly executed without a path (such as &quot;findstr,&quot; &quot;net,&quot; and &quot;python&quot;). If this activity occurs outside of known administration activity, upgrades, installations, or patches, then it may be suspicious.\n\nData and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as network connections made for Command and Control, learning details about the environment through Discovery, and Lateral Movement.</td></tr><tr><th>platforms</th><td>Linux, Windows, macOS</td></tr><tr><th>data sources</th><td>File: File Creation, Process: Process Creation, Windows Registry: Windows Registry Key Modification</td></tr></table>", "t1_0_cap_1": "<table class='meta-table'><tr><th>capec_Name</th><td>Subverting Environment Variable Values</td></tr><tr><th>CVE ID</th><td>CVE-2018-7844 | CVE-2018-7848 | CVE-2019-6849 | CVE-2019-6850 | CVE-2019-6851</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1574.007 - Hijack Execution Flow:Path Interception by PATH Environment Variable</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>The adversary directly or indirectly modifies environment variables used by or controlling the target software. The adversary&#x27;s goal is to cause the target software to deviate from its expected operation in a manner that benefits the adversary.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Very High</td></tr><tr><th>capec_Execution_Flow</th><t cious data and try to bypass the authentication mechanism. || High: Some more advanced attacks may require knowledge about protocols and probing technique which help controlling a variable. The malicious user may try to understand the authentication mechanism in order to defeat it.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality, Integrity, Availability | Impact: Execute Unauthorized Commands || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism || Scope: Availability | Impact: Unreliable Execution || Scope: Confidentiality | Impact: Read Data || Scope: Accountability | Impact: Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Protect environment variables against unauthorized read and write access. || Protect the configuration files which contain environment variables against illegitimate read and write access. || Assume all input is malicious. Create an allowlist that defines all valid input to the software system based on the requirements specifications. Input that does not match against the allowlist should not be permitted to enter into the system. || Apply the least privilege principles. If a process has no legitimate reason to read an environment variable do not give that privilege.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-353, CWE-285, CWE-302, CWE-74, CWE-15, CWE-73, CWE-20, CWE-200</td></tr><tr><th>exposure_tags</th><td>Modbus, SNMP | Modbus | TFTP</td></tr></table>", "t1_cwe_1": "<table class='meta-table'><tr><th>cwe_Name</th><td>Improper Authentication</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-284: Improper Access Control vulnerability exists in all versions of the Modicon M580, Modicon M340, Modicon Quantum, and Modicon Premium which could cause denial of service or potential code execution by overwriting configuration settings of the controller over Modbus.</td></tr><tr><th>cwe_Abstraction</th><td>Class</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Draft</td></tr><tr><th>cwe_Description</th><td>When an actor claims to have a given identity, the product does not prove or insufficiently proves that the claim is correct.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-284 (ChildOf, View: 1000, Ordinal: Primary); CWE-284 (ChildOf, View: 1340, Ordinal: Primary)</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Architecture and Design: N/A | Implementation: REALIZATION: This weakness is caused during implementation of an architectural security tactic.</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Integrity, Confidentiality, Availability, Access Control | Impact: Read Application Data, Gain Privileges or Assume Identity, Execute Unauthorized Code or Commands | Note: This weakness can lead to the exposure of resources or functionality to unintended actors, possibly providing attackers with sensitive information or even execute arbitrary code.</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Automated Static Analysis | Effectiveness: Limited | Description:  || Method: Manual Static Analysis | Effectiveness: High | Description:  || Method: Manual Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis | Effectiveness: SOAR Partial | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Architecture and Design | Description: N/A</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>HIGH</td></tr><tr><th>exploitabilityScore</th><td>3.9</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t1_1_sub_2": "<table class='meta-table'><tr><th>technique_name</th><td>Server Software Component</td></tr><tr><th>subtechnique_name</th><td>Server Software Component: Web Shell</td></tr><tr><th>tactics</th><td>Persistence</td></tr><tr><th>detection</th><td>Web shells can be difficult to detect. Unlike other forms of persistent remote access, they do not initiate connections. The portion of the Web shell that is on the server may be small and innocuous looking. The PHP version of the China Chopper Web shell, for example, is the following short payload: (Citation: Lee 2013) \n\n&lt;code&gt;&amp;lt;?php @eval($_POST[&#x27;password&#x27;]);&amp;gt;&lt;/code&gt;\n\nNevertheless, detection mechanisms exist. Process monitoring may be used to detect Web servers that perform suspicious actions such as spawning cmd.exe or accessing files that are not in the Web directory.(Citation: NSA Cyber Mitigating Web Shells)\n\nFile monitoring may be used to detect changes to files in the Web directory of a Web server that do not match with updates to the Web server&#x27;s content and may indicate implantation of a Web shell script.(Citation: NSA Cyber Mitigating Web Shells)\n\nLog authentication attempts to the server and any unusual traffic patterns to or from the server and internal network. (Citation: US-CERT Alert TA15-314A Web Shells)</td></tr><tr><th>platforms</th><td>Linux, Network, Windows, macOS</td></tr><tr><th>data sources</th><td>Application Log: Application Log Content, File: File Creation, File: File Modification, Network Traffic: Network Traffic Content, Network Traffic: Network Traffic Flow, Process: Process Creation</td></tr></table>", "t1_1_cap_2": "<table class='meta-table'><tr><th>capec_Name</th><td>Upload a Web Shell to a Web Server</td></tr><tr><th>CVE ID</th><td>CVE-2018-7847</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1505.003 - Server Software Component:Web Shell</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Draft</td></tr><tr><th>capec_Description</th><td>By exploiting insufficient permissions, it is possible to upload a web shell to a web server in such a way that it can be executed remotely. This shell can have various capabilities, thereby acting as a &quot;gateway&quot; to the underlying web server. The shell might execute at the higher permission level of the web server, providing the ability the execute malicious code at elevated levels.</td></tr><tr><th>capec_Typical_Severity</th><td>High</td></tr><tr><th>capec_Prerequisites</th><td>The web server is susceptible to one of the various web application exploits that allows for uploading a shell file.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges || Scope: Confidentiality, Integrity, Availability | Impact: Execute Unauthorized Commands</td></tr><tr><th>capec_Mitigations</th><td>Make sure your web server is up-to-date with all patches to protect against known vulnerabilities. || Ensure that the file permissions in directories on the web server from which files can be execute is set to the &quot;least privilege&quot; settings, and that those directories contents is controlled by an allowlist.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-287, CWE-553</td></tr><tr><th>exposure_tags</th><td>Modbus</td></tr></table>", "t1_cwe_2": "<table class='meta-table'><tr><th>cwe_Name</th><td>Improper Neutralization of Special Elements in Output Used by a Downstream Component (&#x27;Injection&#x27;)</td></tr><tr><th>CVE ID</th><td>CVE-2020-7475</td></tr><tr><th>baseScore</th><td>9.8</td></tr><tr><th>baseSeverity</th><td>CRITICAL</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>Description</th><td>A CWE-74: Improper Neutralization of Special Elements in Output Used by a Downstream Component (&#x27;Injection&#x27;), reflective DLL, vulnerability exists in EcoStruxure Control Expert (all versions prior to 14.1 Hot Fix), Unity Pro (all versions), Modicon M340 (all versions prior to V3.20), Modicon M580 (all versions prior to V3.10), which, if exploited, could allow attackers to transfer malicious code to the controller.</td></tr><tr><th>cwe_Abstraction</th><td>Class</td></tr><tr><th>cwe_Structure</th><td>Simple</td></tr><tr><th>cwe_Status</th><td>Incomplete</td></tr><tr><th>cwe_Description</th><td>The product constructs all or part of a command, data structure, or record using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify how it is parsed or interpreted when it is sent to a downstream component.</td></tr><tr><th>cwe_Extended_Description</th><td>Software or other automated logic has certain assumptions about what constitutes data and control respectively. It is the lack of verification of these assumptions for user-controlled input that leads to injection problems. Injection problems encompass a wide variety of issues -- all mitigated in very different ways and usually attempted in order to alter the control flow of the process. For this reason, the most effective way to discuss these weaknesses is to note the distinct features that classify them as injection weaknesses. The most important issue to note is that all injection problems share one thing in common -- i.e., they allow for the injection of control plane data into the user-controlled data plane. This means that the execution of the process may be altered by sending code in through legitimate data channels, using no other mechanism. While buffer overflows, and many other flaws, involve the use of some further issue to gain execution, injection problems need only for the data to be parsed.</td></tr><tr><th>cwe_Related_Weaknesses</th><td>CWE-707 (ChildOf, View: 1000, Ordinal: Primary)</td></tr><tr><th>cwe_Weakness_Ordinality</th><td>Primary</td></tr><tr><th>cwe_Modes_Of_Introduction</th><td>Implementation: REALIZATION: This weakness is caused during implementation of an architectural security tactic.</td></tr><tr><th>cwe_Likelihood_Of_Exploit</th><td>High</td></tr><tr><th>cwe_Common_Consequences</th><td>Scope: Confidentiality | Impact: Read Application Data | Note: Many injection attacks involve the disclosure of important information -- in terms of both data sensitivity and usefulness in further exploitation. || Scope: Access Control | Impact: Bypass Protection Mechanism | Note: In some cases, injectable code controls authentication; this may lead to a remote vulnerability. || Scope: Other | Impact: Alter Execution Logic | Note: Injection attacks are characterized by the ability to significantly change the flow of a given process, and in some cases, to the execution of arbitrary code. || Scope: Integrity, Other | Impact: Other | Note: Data injection attacks lead to loss of data integrity in nearly all cases as the control-plane data injected is always incidental to data recall or writing. || Scope: Non-Repudiation | Impact: Hide Activities | Note: Often the actions performed by injected control code are unlogged.</td></tr><tr><th>cwe_Detection_Methods</th><td>Method: Automated Static Analysis | Effectiveness: High | Description: Automated static analysis, commonly referred to as Static Application Security Testing (SAST), can find some instances of this weakness by analyzing source code (or binary/compiled code) without having to execute it. Typically, this is done by building a model of data flow and control flow, then searching for potentially-vulnerable patterns that connect &quot;sources&quot; (origins of input) with &quot;sinks&quot; (destinations where the data interacts with external components, a lower layer such as the OS, etc.)</td></tr><tr><th>cwe_Potential_Mitigations</th><td>Phase: Requirements | Description: N/A || Phase: Implementation | Description: N/A</td></tr><tr><th>attackComplexity</th><td>LOW</td></tr><tr><th>privilegesRequired</th><td>NONE</td></tr><tr><th>userInteraction</th><td>NONE</td></tr><tr><th>confidentialityImpact</th><td>HIGH</td></tr><tr><th>availabilityImpact</th><td>HIGH</td></tr><tr><th>exploitabilityScore</th><td>3.9</td></tr></table>", "t1_2_sub_3": "<table class='meta-table'><tr><th>technique_name</th><td>Hijack Execution Flow</td></tr><tr><th>subtechnique_name</th><td>Hijack Execution Flow: Dynamic Linker Hijacking</td></tr><tr><th>tactics</th><td>Persistence</td></tr><tr><th>detection</th><td>Monitor for changes to environment variables and files associated with loading shared libraries such as &lt;code&gt;LD_PRELOAD&lt;/code&gt; and &lt;code&gt;DYLD_INSERT_LIBRARIES&lt;/code&gt;, as well as the commands to implement these changes.\n\nMonitor processes for unusual activity (e.g., a process that does not use the network begins to do so). Track library metadata, such as a hash, and compare libraries that are loaded at process execution time against previous executions to detect differences that do not correlate with patching or updates.</td></tr><tr><th>platforms</th><td>Linux, macOS</td></tr><tr><th>data sources</th><td>Command: Command Execution, File: File Creation, File: File Modification, Module: Module Load, Process: Process Creation</td></tr></table>", "t1_2_cap_3": "<table class='meta-table'><tr><th>capec_Name</th><td>Subverting Environment Variable Values</td></tr><tr><th>CVE ID</th><td>CVE-2020-7475</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1574.006 - Hijack Execution Flow:Dynamic Linker Hijacking</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>The adversary directly or indirectly modifies environment variables used by or controlling the target software. The adversary&#x27;s goal is to cause the target software to deviate from its expected operation in a manner that benefits the adversary.</td></tr><tr><th>capec_Likelihood_Of_Attack</th><td>High</td></tr><tr><th>capec_Typical_Severity</th><td>Very High</td></tr><tr><th>capec_Execution_Flow</th><td>Step 1: Explore - [Probe target application] The adversary first probes the target application to determine important information about the target. This information could include types software used, software versions, what user input the application consumes, and so on. Most importantly, the adversary tries to determine what environment variables might be used by the underlying software, or even the application itself. (Techniques: N/A) || Step 2: Experiment - [Find user-controlled environment variables] Using the information found by probing the application, the adversary attempts to manipulate any user-controlled environment variables they have found are being used by the application, or suspect are being used by the application, and observe the effects of these changes. If the adversary notices any significant changes to the application, they will know that a certain environment variable is important to the application behavior and indicates a possible attack vector. (Techniques: Alter known environment variables such as &quot;$PATH&quot;, &quot;$HOSTNAME&quot;, or &quot;LD_LIBRARY_PATH&quot; and see if application behavior changes.) || Step 3: Exploit - [Manipulate user-controlled environment variables] The adversary manipulates the found environment variable(s) to abuse the normal flow of processes or to gain access to privileged resources. (Techniques: N/A)</td></tr><tr><th>capec_Prerequisites</th><td>An environment variable is accessible to the user. || An environment variable used by the application can be tainted with user supplied data. || Input data used in an environment variable is not validated properly. || The variables encapsulation is not done properly. For instance setting a variable as public in a class makes it visible and an adversary may attempt to manipulate that variable.</td></tr><tr><th>capec_Skills_Required</th><td>Low: In a web based scenario, the client controls the data that it submitted to the server. So anybody can try to send malicious data and try to bypass the authentication mechanism. || High: Some more advanced attacks may require knowledge about protocols and probing technique which help controlling a variable. The malicious user may try to understand the authentication mechanism in order to defeat it.</td></tr><tr><th>capec_Consequences</th><td>Scope: Confidentiality, Integrity, Availability | Impact: Execute Unauthorized Commands || Scope: Confidentiality, Access Control, Authorization | Impact: Bypass Protection Mechanism || Scope: Availability | Impact: Unreliable Execution || Scope: Confidentiality | Impact: Read Data || Scope: Accountability | Impact: Hide Activities</td></tr><tr><th>capec_Mitigations</th><td>Protect environment variables against unauthorized read and write access. || Protect the configuration files which contain environment variables against illegitimate read and write access. || Assume all input is malicious. Create an allowlist that defines all valid input to the software system based on the requirements specifications. Input that does not match against the allowlist should not be permitted to enter into the system. || Apply the least privilege principles. If a process has no legitimate reason to read an environment variable do not give that privilege.</td></tr><tr><th>capec_Related_Weaknesses</th><td>CWE-353, CWE-285, CWE-302, CWE-74, CWE-15, CWE-73, CWE-20, CWE-200</td></tr></table>", "t1_2_sub_4": "<table class='meta-table'><tr><th>technique_name</th><td>Hijack Execution Flow</td></tr><tr><th>subtechnique_name</th><td>Hijack Execution Flow: Path Interception by PATH Environment Variable</td></tr><tr><th>tactics</th><td>Persistence</td></tr><tr><th>detection</th><td>Monitor file creation for files named after partial directories and in locations that may be searched for common processes through the environment variable, or otherwise should not be user writable. Monitor the executing process for process executable paths that are named for partial directories. Monitor file creation for programs that are named after Windows system programs or programs commonly executed without a path (such as &quot;findstr,&quot; &quot;net,&quot; and &quot;python&quot;). If this activity occurs outside of known administration activity, upgrades, installations, or patches, then it may be suspicious.\n\nData and events should not be viewed in isolation, but as part of a chain of behavior that could lead to other activities, such as network connections made for Command and Control, learning details about the environment through Discovery, and Lateral Movement.</td></tr><tr><th>platforms</th><td>Linux, Windows, macOS</td></tr><tr><th>data sources</th><td>File: File Creation, Process: Process Creation, Windows Registry: Windows Registry Key Modification</td></tr></table>", "t1_2_cap_4": "<table class='meta-table'><tr><th>capec_Name</th><td>Subverting Environment Variable Values</td></tr><tr><th>CVE ID</th><td>CVE-2020-7475</td></tr><tr><th>attackVector</th><td>NETWORK</td></tr><tr><th>capec_Mitre_Techniques</th><td>1574.007 - Hijack Execution Flow:Path Interception by PATH Environment Variable</td></tr><tr><th>capec_Abstraction</th><td>Detailed</td></tr><tr><th>capec_Status</th><td>Stable</td></tr><tr><th>capec_Description</th><td>The adversary directly or indirectly modifies environment variables used by omated Static Analysis | Effectiveness: Limited | Description:  || Method: Manual Static Analysis | Effectiveness: High | Description:  || Method: Manual Static Analysis - Binary or Bytecode | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Automated Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Dynamic Analysis with Manual Results Interpretation | Effectiveness: SOAR Partial | Description:  || Method: Manual Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis - Source Code | Effectiveness: SOAR Partial | Description:  || Method: Automated Static Analysis | Effectiveness: SOAR Partial | Description:  || Method: Architecture or Design Review | Effectiveness: High | Description:", "cwe_Potential_Mitigations": "Phase: Architecture and Design | Description: N/A", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "confidentialityImpact": "HIGH", "availabilityImpact": "HIGH", "exploitabilityScore": "3.9", "exposure_tags": "Modbus"}}, {"id": "t1_1_sub_2", "label": "Server Software Component: Web Shell", "type": "subtech", "metadata": {"subtechnique_name": "Server Software Component: Web Shell", "technique_name": "Server Software Component", "tactics": "Persistence", "detection": "Web shells can be difficult to detect. Unlike other forms of persistent remote access, they do not initiate connections. The portion of the Web shell that is on the server may be small and innocuous looking. The PHP version of the China Chopper Web shell, for example, is the following short payload: (Citation: Lee 2013) \n\n<code>&lt;?php @eval($_POST['password']);&gt;</code>\n\nNevertheless, detection mechanisms exist. Process monitoring may be used to detect Web servers that perform suspicious actions such as spawning cmd.exe or accessing files that are not in the Web directory.(Citation: NSA Cyber Mitigating Web Shells)\n\nFile monitoring may be used to detect changes to files in the Web directory of a Web server that do not match with updates to the Web server's content and may indicate implantation of a Web shell script.(Citation: NSA Cyber Mitigating Web Shells)\n\nLog authentication attempts to the server and any unusual traffic patterns to or from the server and internal network. (Citation: US-CERT Alert TA15-314A Web Shells)", "platforms": "Linux, Network, Windows, macOS", "data sources": "Application Log: Application Log Content, File: File Creation, File: File Modification, Network Traffic: Network Traffic Content, Network Traffic: Network Traffic Flow, Process: Process Creation"}}, {"id": "t1_1_cap_2", "label": "Upload a Web Shell to a Web Server", "type": "capec", "metadata": {"CVE ID": "CVE-2018-7847", "capec_Name": "Upload a Web Shell to a Web Server", "capec_Mitre_Techniques": "1505.003 - Server Software Component:Web Shell", "capec_Abstraction": "Detailed", "capec_Status": "Draft", "capec_Description": "By exploiting insufficient permissions, it is possible to upload a web shell to a web server in such a way that it can be executed remotely. This shell can have various capabilities, thereby acting as a \"gateway\" to the underlying web server. The shell might execute at the higher permission level of the web server, providing the ability the execute malicious code at elevated levels.", "capec_Typical_Severity": "High", "capec_Prerequisites": "The web server is susceptible to one of the various web application exploits that allows for uploading a shell file.", "capec_Consequences": "Scope: Confidentiality | Impact: Read Data || Scope: Confidentiality, Access Control, Authorization | Impact: Gain Privileges || Scope: Confidentiality, Integrity, Availability | Impact: Execute Unauthorized Commands", "capec_Mitigations": "Make sure your web server is up-to-date with all patches to protect against known vulnerabilities. || Ensure that the file permissions in directories on the web server from which files can be execute is set to the \"least privilege\" settings, and that those directories contents is controlled by an allowlist.", "capec_Related_Weaknesses": "CWE-287, CWE-553", "attackVector": "NETWORK", "exposure_tags": "Modbus"}}, {"id": "t1_1_and_2", "label": "AND", "type": "gate"}, {"id": "t1_cwe_2", "label": "Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection')", "type": "cwe", "metadata": {"CVE ID": "CVE-2020-7475", "Description": "A CWE-74: Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection'), reflective DLL, vulnerability exists in EcoStruxure Control Expert (all versions prior to 14.1 Hot Fix), Unity Pro (all versions), Modicon M340 (all versions prior to V3.20), Modicon M580 (all versions prior to V3.10), which, if exploited, could allow attackers to transfer malicious code to the controller.", "cwe_Name": "Improper Neutralization of Special Elements in Output Used by a Downstream Component ('Injection')", "cwe_Abstraction": "Class", "cwe_Structure": "Simple", "cwe_Status": "Incomplete", "cwe_Description": "The product constructs all or part of a command, data structure, or record using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify how it is parsed or interpreted when it is sent to a downstream component.", "cwe_Extended_Description": "Software or other automated logic has certain assumptions about what constitutes data and control respectively. It is the lack of verification of these assumptions for user-controlled input that leads to injection problems. Injection problems encompass a wide variety of issues -- all mitigated in very different ways and usually attempted in order to alter the control flow of the process. For this reason, the most effective way to discuss these weaknesses is to note the distinct features that classify them as injection weaknesses. The most important issue to note is that all injection problems share one thing in common -- i.e., they allow for the injection of control plane data into the user-controlled data plane. This means that the execution of the process may be altered by sending code in through legitimate data channels, using no other mechanism. While buffer overflows, and many other flaws, involve the use of some further issue to gain execution, injection problems need only for the data to be parsed.", "cwe_Related_Weaknesses": "CWE-707 (ChildOf, View: 1000, Ordinal: Primary)", "cwe_Weakness_Ordinality": "Primary", "cwe_Modes_Of_Introduction": "Implementation: REALIZATION: This weakness is caused during implementation of an architectural security tactic.", "cwe_Likelihood_Of_Exploit": "High", "cwe_Common_Consequences": "Scope: Confidentiality | Impact: Read Application Data | Note: Many injection attacks involve the disclosure of important information -- in terms of both data sensitivity and usefulness in further exploitation. || Scope: Access Control | Impact: Bypass Protection Mechanism | Note: In some cases, injectable code controls authentication; this may lead to a remote vulnerability. || Scope: Other | Impact: Alter Execution Logic | Note: Injection attacks are characterized by the ability to significantly change the flow of a given process, and in some cases, to the execution of arbitrary code. || Scope: Integrity, Other | Impact: Other | Note: Data injection attacks lead to loss of data integrity in nearly all cases as the control-plane data injected is always incidental to data recall or writing. || Scope: Non-Repudiation | Impact: Hide Activities | Note: Often the actions performed by injected control code are unlogged.", "cwe_Detection_Methods": "Method: Automated Static Analysis | Effectiveness: High | Description: Automated static analysis, commonly referred to as Static Application Security Testing (SAST), can find some instances of this weakness by analyzing source code (or binary/compiled code) without having to execute it. Typically, this is done by building a model of data flow and control flow, then searching for potentially-vulnerable patterns that connect \"sources\" (origins of input) with \"sinks\" (destinations where the data interacts with external components, a lower layer such as the OS, etc.)", "cwe_Potential_Mitigations": "Phase: Requirements | Description: N/A || Phase: Implementation | Description: N/A", "attackVector": "NETWORK", "baseScore": "9.8", "baseSeverity": "CRITICAL", "attackComplexity": "LOW", "privilegesRequired": "NONE", "userInteraction": "NONE", "confidentialityImpact": "HIGH", "availabilityImpact": "HIGH", "exploitabilityScore": "3.9"}}, {"id": "t1_2_sub_3", "label": "Hijack Execution Flow: Dynamic Linker Hijacking", "type": "subtech", "metadata": {"subtechnique_name": "Hijack Execution Flow: Dynamic Linker Hijacking", "technique_name": "Hijack Execution Flow", "tactics": "Persistence", "detection": "Monitor for changes to environment variables and files associated with loading shared libraries such as <code>LD_PRELOAD</code> and <code>DYLD_INSERT_LIBRARIES</code>, as well as the commands to implement these changes.\n\nMonitor processes for unusual activity (e.g., a process that does not use the network begins to do so). Track library metadata, such as a hash, and compare libraries that are loaded at process execution time against previous executions to detect differences that do not correlate with patching or updates.", "platforms": "Linux, macOS", "data sources": "Command: Command Execution, File: File Creation, File: File Modification, Module: Module Load, Process: Process Creation"}}, {"id": "t1_2_cap_3", "label": "Subverting Environment Variable Values", "type": "capec", "metadata": {"CVE ID": "CVE-2020-7475", "capec_Name": "Subverting Environment Variable Values", "capec_Mitre_Techniques": "1574.006 - Hijack Execution Flow:Dynamic Linker Hijacking", "capec_Abstraction": "Detailed", "capec_Status": "Stable", "capec_Description": "The adversary directly or indirectly modifies environment variables used by or controlling the target software. The adversary's goal is to cause the target software to deviate from its expected operation in a manner that benefits the adversary.", "capec_Likelihood_Of_Attack": "High", "capec_Typical_Severity": "Very High", "capec_Execution_Flow": "Step 1: Explore - [Probe target application] The adversary first probes the target application to determine important information about the target. This information could include types software used, software versions, what user input the application consumes, and so on. Most importantly, the adversary tries to determine what environment variables might be used by the underlying software, or even the application itself. (Techniques: N/A) || Step 2: Experiment - [Find user-controlled environment variables] Using the information found by probing the application, the adversary attempts to manipulate any user-controlled environment variables they have found are being used by the application, or suspect are being used by the application, and observe the effects of these changes. If the adversary notices any significant changes to the application, they will know that a certain environment variable is important to the application behavior and indicates a possible attack vector. (Techniques: Alter known environment variables such as \"$PATH\", \"$HOSTNAME\", or \"LD_LIBRARY_PATH\" and see if application behavior changes.) || Step 3: Exploit - [Manipulate user-controlled environment variables] The adversary manipulates the found environment variable(s) to abuse the normal flow of processes or to gain access to privileged resources. (Techniques: N/A)", "capec_Prerequisites": "An environment variable is accessible to the user. || An environment variable used by the application can be tainted with user supplied data. || var nodeInfo = {};
NODES_DATA.forEach(function(n) { nodeInfo[n.id] = n; });
var panelCol  = document.getElementById('panel-col');
var panelBody = document.getElementById('panel-body');
var panelTitle= document.getElementById('panel-title');
var closeBtn  = document.getElementById('close-btn');
var svgScroll = document.getElementById('svg-scroll');
var selectedGroup = null;
function showPanel(nodeId) {
  var info = nodeInfo[nodeId] || {};
  var label = info.label || nodeId;
  var ntype = info.type || 'unknown';
  var htmlTbl = NODE_HTML[nodeId] || '<div class="meta-empty">No metadata recorded for this node.</div>';
  panelTitle.textContent = 'Node metadata';
  var badgeClass = 'badge-' + ntype;
  panelBody.innerHTML = '<p class="node-label-heading">' + escHtml(label) + '</p>' +
    '<span class="node-type-badge ' + badgeClass + '">' + escHtml(ntype) + '</span>' + htmlTbl;
  panelCol.classList.remove('hidden');
}
function closePanel() {
  panelCol.classList.add('hidden');
  if (selectedGroup) { selectedGroup.classList.remove('selected-node'); selectedGroup = null; }
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
document.addEventListener('DOMContentLoaded', function() {
  var groups = svgScroll.querySelectorAll('[data-node-id]');
  groups.forEach(function(g) {
    g.addEventListener('click', function(ev) {
      ev.stopPropagation();
      var nodeId = g.getAttribute('data-node-id');
      if (selectedGroup && selectedGroup !== g) { selectedGroup.classList.remove('selected-node'); }
      if (selectedGroup === g) { closePanel(); return; }
      selectedGroup = g; g.classList.add('selected-node'); showPanel(nodeId);
    });
  });
  svgScroll.addEventListener('click', function() { closePanel(); });
  closeBtn.addEventListener('click', closePanel);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closePanel(); });
});
</script>
