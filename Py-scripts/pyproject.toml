[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cve2at"
version = "1.0.0"
description = "CPE -> CVEs -> CWE -> CAPEC -> ATT&CK -> attack trees, from the terminal"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "requests>=2.28", "graphviz>=0.20", "matplotlib>=3.5", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
cve2at = "cve2at.cli:main"

[tool.setuptools]
packages = ["cve2at"]

[tool.pytest.ini_options]
testpaths = ["tests"]
